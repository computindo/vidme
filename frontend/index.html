<!doctype html>
<html lang="en" class="bg-[#0b1326] text-slate-100">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VidMe</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/navidrome.svg">
  <link rel="preload" href="/material-symbols.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind.css">
  
  <style>
    @font-face{font-family:"Material Symbols Outlined";font-style:normal;font-weight:400;src:url(/material-symbols.woff2) format("woff2");font-display:block}.material-symbols-outlined{font-size:22px;line-height:1;font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
    .scrollbar::-webkit-scrollbar{width:5px}
    @media(min-width:1024px){aside.sidebar-scroll{display:flex!important;flex-direction:column;overflow:hidden}}.scrollbar::-webkit-scrollbar-thumb{background:#33405b;border-radius:9px}
    .video-card.select-mode .card-check { display:flex !important; }
    .video-card.selected { outline: 2px solid #6366f1; }
    /* Toast */
    #toastContainer { position:fixed; bottom:80px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .toast { display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:12px; font-size:13px; font-weight:500; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:auto; max-width:320px; }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.success { background:#1e3a2f; border:1px solid #22c55e44; color:#86efac; }
    .toast.error   { background:#3a1e1e; border:1px solid #ef444444; color:#fca5a5; }
    .toast.info    { background:#1e2a3a; border:1px solid #6366f144; color:#a5b4fc; }
    .toast-progress { height:3px; border-radius:4px; background:#6366f1; transition:width .2s; }
    /* Actions dropdown */
    #actionsMenu { min-width:160px; }
    /* Folder context menu */
    .ctx-menu { position:fixed; z-index:60; min-width:160px; }
    .ctx-item { width:100%; }
    /* Draggable modal */
    #uploadForm { cursor: default; }
    #modalHeader { cursor: grab; user-select: none; -webkit-user-select: none; }
    #modalHeader:active { cursor: grabbing; }
    /* Select toggle switch */
    #selectCheckbox {
      display: none;
    }
    .select-switch {
      position: relative;
      width: fit-content;
      padding: 8px 16px;
      background-color: #1a2236;
      border-radius: 0.5em;
      z-index: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      font-size: 0.85em;
      font-weight: 600;
      transition: all 0.3s;
      user-select: none;
    }
    .select-switch svg path {
      fill: white;
    }
    #selectCheckbox:checked + .select-switch {
      background-color: #7C70E6;
      box-shadow: 0px 0px 40px rgba(124, 112, 230, 0.438);
    }
    /* Upload button dark neumorphic */
    .upload-btn {
      position: relative;
      color: #fff;
      padding: 8px 16px;
      font-size: 0.85em;
      font-weight: 600;
      border-radius: 0.5em;
      background: #1a2236;
      border: 1px solid #1a2236;
      transition: all 0.3s;
      box-shadow: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .upload-btn:active {
      color: #aaa;
      box-shadow: none;
    }
    @media(min-width:1024px){#searchWrapper{display:block!important}#uploadOpen{display:flex!important}
      #sidebar{transition:margin-left 0.3s cubic-bezier(0.25,1,0.5,1)}
      .sidebar-collapsed #sidebar{margin-left:-280px}
      #main-content{transition:margin-left 0.3s cubic-bezier(0.25,1,0.5,1)}
      .sidebar-collapsed #main-content{margin-left:0!important}
      #main-content{margin-left:280px}
    }
    /* Upload reskin */
    .vidme-loader { display:block; width:20px; height:20px; position:relative; flex-shrink:0; }
    .vidme-loader:before, .vidme-loader:after { content:""; position:absolute; left:50%; bottom:0; width:12px; height:12px; border-radius:50%; background:#7dd3fc; transform:translate(-50%,0%) scale(1); animation:vidme_push 2s infinite linear; }
    .vidme-loader:after { animation-delay:1s; }
    @keyframes vidme_push { 0%,50%{ transform:translate(-50%,0%) scale(1); } 100%{ transform:translate(-50%,-100%) scale(0); } }
    .vidme-bar-bg { --h:8px; display:flex; align-items:center; box-sizing:border-box; padding:3px; width:100%; height:var(--h); background-color:#0f1a2a; box-shadow:#0c0c0c -2px 2px 4px 0px inset; border-radius:calc(var(--h)/2); overflow:hidden; }
    .vidme-bar { position:relative; display:flex; align-items:center; --h:6px; height:var(--h); width:0%; background:linear-gradient(0deg,rgba(14,165,233,1) 0%,rgba(125,211,252,1) 100%); border-radius:calc(var(--h)/2); transition:width 0.2s; overflow:hidden; }
    .vidme-bar-stripes { position:absolute; display:flex; align-items:center; gap:18px; }
    .vidme-bar-stripe { background:linear-gradient(-45deg,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 70%); width:10px; height:45px; opacity:0.3; rotate:45deg; }
    /* vidme-v27: pagination css baru (pengganti pg lama) */
    .pagination-wrapper { display:flex; justify-content:center; padding:20px 0 8px; }
    .j-pagination { display:inline-flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; }
    .j-pagination .pagination__item { min-width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; padding:0 8px; border-radius:8px; color:#94a3b8; font-size:14px; cursor:pointer; text-decoration:none; transition:all .15s; }
    .j-pagination a.pagination__item:hover { background:#1e293b; color:#e2e8f0; }
    .j-pagination .pagination-active { background:rgba(99,102,241,.15); border:1px solid #6366f1; color:#a5b4fc; font-weight:700; }
    .j-pagination .pagination-disabled { opacity:.35; cursor:not-allowed; }
    /* vidme-v27: Suggested 15 desktop / 12 mobile */
    .sugg-grid > *:nth-child(n+13) { display:none; }
    @media (min-width: 1024px) { .sugg-grid > *:nth-child(n+13) { display:revert; } }
    /* vidme-v27: explore v2 css — From Uiverse.io by vinodjangid07, hijau diganti biru langit (catatan user 25-09-26) */
    .button {
      width: 110px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      background-color: rgb(56, 189, 248);
      border-radius: 30px;
      color: rgb(19, 19, 19);
      font-weight: 600;
      border: none;
      position: relative;
      cursor: pointer;
      box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.116);
      padding-left: 8px;
      transition-duration: .5s;
    }

    .svgIcon {
      height: 25px;
      transition-duration: 1.5s;
    }

    .button:hover {
      background-color: rgb(125, 211, 252);
      transition-duration: .5s;
    }

    .button:active {
      transform: scale(0.97);
      transition-duration: .2s;
    }

    .button:hover .svgIcon {
      transform: rotate(250deg);
      transition-duration: 1.5s;
    }
    /* vidme-recent-hero v2.5: one large card per slide, scoped to Recent Uploads */
    .recent-slider { position:relative; width:min(100%,960px); margin:0 auto; overflow:hidden; border-radius:16px; background:#0b1326; box-shadow:0 12px 32px rgba(0,0,0,.28); }
    .recent-slides { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .recent-slides::-webkit-scrollbar { display:none; }
    .recent-slides .video-card { position:relative; flex:0 0 100%; width:100%; min-width:100%; margin:0; padding:0 !important; overflow:hidden; border-radius:16px; scroll-snap-align:start; scroll-snap-stop:always; background:#111827; }
    .recent-slides .video-card:hover { transform:none; background:#111827; }
    .recent-slides .video-card > .relative { aspect-ratio:16 / 9; border-radius:0; background:#050507; }
    .recent-slides .video-card > .relative::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.08) 58%,rgba(0,0,0,.1)); }
    .recent-slides .video-card > p.mt-3 { position:absolute; z-index:2; left:28px; right:28px; bottom:40px; margin:0; color:#fff; font-size:clamp(1.1rem,2.2vw,1.8rem); line-height:1.2; text-shadow:0 2px 8px rgba(0,0,0,.7); }
    .recent-slides .video-card > p.text-xs { position:absolute; z-index:2; left:28px; bottom:18px; margin:0; color:rgba(226,232,240,.78); }
    .recent-slides .video-card .absolute { z-index:3; }
    .recent-nav { position:absolute; z-index:5; top:50%; width:52px; height:52px; padding:0; border:1px solid rgba(255,255,255,.65); border-radius:50%; line-height:1; text-align:center; cursor:pointer; transform:translateY(-50%); background:rgba(255,255,255,.84); color:#1e293b; box-shadow:0 3px 12px rgba(0,0,0,.28); user-select:none; -webkit-user-select:none; transition:all .2s ease; }
    .recent-nav:hover { background:#fff; color:#0f172a; transform:translateY(-50%) scale(1.08); }
    #recent-prev { left:18px; }
    #recent-next { right:18px; }
    .recent-counter { position:absolute; z-index:5; top:16px; right:20px; padding:5px 10px; border-radius:999px; background:rgba(0,0,0,.48); color:#fff; font-size:12px; font-weight:700; letter-spacing:.04em; }
    .recent-dots { position:absolute; z-index:5; left:50%; bottom:16px; display:flex; align-items:center; gap:8px; transform:translateX(-50%); }
    .recent-dot { width:9px; height:9px; padding:0; border:0; border-radius:5px; cursor:pointer; background:rgba(255,255,255,.52); transition:all .3s cubic-bezier(.77,0,.175,1); }
    .recent-dot:hover { background:rgba(255,255,255,.82); }
    .recent-dot.active { width:24px; background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.35); }
    @media (max-width:640px) {
      .recent-slider { border-radius:12px; }
      .recent-slides .video-card { border-radius:12px; }
      .recent-slides .video-card > p.mt-3 { left:18px; right:18px; bottom:34px; }
      .recent-slides .video-card > p.text-xs { left:18px; bottom:14px; }
      .recent-nav { width:42px; height:42px; }
      #recent-prev { left:10px; }
      #recent-next { right:10px; }
      .recent-counter { top:10px; right:12px; }
      .recent-dots { bottom:10px; }
    }

    /* ── vidme-cardsize v2.2 (22-09-26): grid ala Vcs (minmax), SEMUA frame 9:16, landscape letterbox (user opsi A) ── */
    #videos .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
    @media (min-width: 760px) { #videos .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
    @media (min-width: 1100px) { #videos .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
    #videos .grid .video-card { width: auto; min-width: 0; }
    #videos .grid .video-card .aspect-video { aspect-ratio: 200.833 / 414.097; background: #050507; }
    #videos .grid .video-card .aspect-video img { object-fit: contain; } /* letterbox: landscape utuh, bar atas-bawah */
    /* ── Player view CSS (from player.html, deduped) ── */
    @font-face{font-family:"Material Symbols Outlined";font-style:normal;font-weight:400;src:url(/material-symbols.woff2) format("woff2");font-display:block}.material-symbols-outlined{font-size:22px;line-height:1;font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
    /* Skip flash */
    .skip-flash {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.55); border-radius: 9999px;
      padding: 10px 18px; font-size: 14px; font-weight: 600;
      opacity: 0; transition: opacity 0.15s;
      color: #fff; white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 25;
    }
    .skip-flash.show { opacity: 1; }
    /* Tap zones + center tap: no text selection, no tap highlight */
    #tap-left, #tap-right, #center-tap {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    /* Play icon fade (opacity only, never visibility:hidden) */
    #play-icon {
      transition: opacity 0.2s;
    }
    /* Controls overlay */
    #controls-overlay {
      transition: opacity 0.25s;
      pointer-events: none;
    }
    #controls-overlay.hidden-ctrl {
      opacity: 0;
    }
    #controls-overlay input,
    #controls-overlay button {
      pointer-events: auto;
    }
    /* Fullscreen: center + fill */
    #player-wrap:-webkit-full-screen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
    #player-wrap:fullscreen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
    #player-wrap:-webkit-full-screen video { width:100%; height:100%; object-fit:contain; }
    #player-wrap:fullscreen video { width:100%; height:100%; object-fit:contain; }
  /* Buffering spinner */
  .vid-spinner svg { transform-origin:center; animation:rotate4 2s linear infinite; }
  .vid-spinner circle { fill:none; stroke:hsl(214,97%,59%); stroke-width:2; stroke-dasharray:1,200; stroke-dashoffset:0; stroke-linecap:round; animation:dash4 1.5s ease-in-out infinite; }
  @keyframes rotate4 { 100%{ transform:rotate(360deg); } }
  @keyframes dash4 { 0%{stroke-dasharray:1,200;stroke-dashoffset:0} 50%{stroke-dasharray:90,200;stroke-dashoffset:-35px} 100%{stroke-dashoffset:-125px} }

    /* Upload UI (mirrored from index.html) */

    /* ── SPA player view: sidebar collapse (Ticket 05) ── */
    body.pv-mode #sidebar { transform: translateX(-100%); transition: transform .3s cubic-bezier(0.25,1,0.5,1); }
    body.pv-mode #sidebar.pv-sidebar-open { transform: translateX(0); }
    #pvSidebarLogo { display: none; }
    body.pv-mode #pvSidebarLogo { display: flex; align-items: center; }
    @media(min-width:1024px){ body.pv-mode #pvSidebarLogo { display: flex; } }
    /* ── SPA player view: bottom nav clearance (Bug fix) ── */
    body.pv-mode #view-player { padding-bottom: 72px; }
    @media(min-width:1024px){ body.pv-mode #view-player { padding-bottom: 0; } }
  </style>
</head>

<body class="min-h-screen bg-[#0b1326] font-body">

  <!-- Toast container -->
  <div id="toastContainer"></div>

  <!-- SPA view: browse -->
  <div id="view-browse">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 hidden w-[280px] border-r border-slate-800 bg-[#10182b] p-6 lg:block sidebar-scroll">
    <div class="mb-10 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 text-2xl font-bold font-heading">
        <span class="material-symbols-outlined text-indigo-400">play_circle</span>VidMe
      </a>
      <button id="sidebarToggleBtn" onclick="toggleSidebar()" title="Collapse sidebar" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:transparent;border:none;cursor:pointer;color:#475569;flex-shrink:0"><span class="material-symbols-outlined">left_panel_close</span></button>
    </div>
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-500">Folders</h2>
      <button id="newFolder" class="rounded p-1 text-slate-400 hover:bg-slate-700" title="New folder">
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>
    <nav id="folders" class="scrollbar space-y-1 overflow-y-auto" style="flex:1;min-height:0"></nav>
  </aside>

  <!-- Main -->
  <main id="main-content" class="pb-24 lg:pb-8">
    <header class="sticky top-0 z-30 flex items-center gap-3 border-b border-slate-800 bg-[#0b1326]/90 px-4 py-4 backdrop-blur md:px-8">
      <button id="sidebarRevealBtn" onclick="toggleSidebar()" title="Open sidebar" style="display:none;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;background:#10182b;border:1px solid #1e293b;cursor:pointer;color:#94a3b8;font-size:13px;white-space:nowrap;flex-shrink:0"><span class="material-symbols-outlined" style="font-size:20px">left_panel_open</span></button>
      <h1 class="font-heading text-xl font-semibold lg:hidden">VidMe</h1>
      <div id="searchWrapper" class="relative ml-auto w-full max-w-md" style="display:none">
        <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-500">search</span>
        <input id="search" class="w-full rounded-xl border border-slate-700 bg-[#171f33] py-2.5 pl-10 pr-10 outline-none focus:border-indigo-400" placeholder="Search videos">
        <button type="button" class="search-clear" id="searchClearDesktop" style="display:none;position:absolute;right:8px;top:9px;z-index:10;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:transparent;color:#94a3b8;cursor:pointer" onclick="clearSearch()" aria-label="Clear search"><span class="material-symbols-outlined" style="font-size:18px">close</span></button>
      </div>
      <input type="checkbox" id="selectCheckbox" />
      <label for="selectCheckbox" class="select-switch" id="selectToggle" style="margin-left:auto">
        <span class="material-symbols-outlined" style="font-size:18px">checklist</span>
        <span class="hidden sm:inline">Select</span>
      </label>
      <button id="uploadOpen" onclick="toggleUploadCenter()" class="upload-btn" style="display:none">
        <span class="material-symbols-outlined" style="font-size:18px">upload</span>
        <span class="hidden sm:inline">Upload</span>
        <span id="uploadBadgeDesktop" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] text-white text-[10px] font-bold flex items-center justify-center px-1" style="background:#7C70E6;box-shadow:0 0 8px rgba(124,112,230,0.6)">0</span>
      </button>
    </header>

    <section class="px-4 py-8 md:px-8">
      <div id="mobileSearchOverlay" style="display:none;margin-bottom:16px"><div style="position:relative"><span class="material-symbols-outlined" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none">search</span><input id="mobileSearchInput" placeholder="Search videos..." style="width:100%;background:#171f33;border:1px solid #334155;border-radius:12px;padding:10px 40px 10px 40px;color:#f1f5f9;outline:none;font-size:15px" oninput="document.getElementById('search').value=this.value;render()" onkeydown="if(event.key==='Enter'){this.blur()}"><button type="button" class="search-clear" id="searchClearMobile" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:10;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:transparent;color:#94a3b8;cursor:pointer" onclick="clearSearch('mobile')" aria-label="Clear search"><span class="material-symbols-outlined" style="font-size:18px">close</span></button></div></div><div class="mb-6 flex items-end justify-between">
        <div>
          <p class="text-sm text-indigo-300">Your collection</p>
          <h2 id="heading" class="font-heading text-3xl font-bold">All videos</h2>
        </div>
        <span id="count" class="text-sm text-slate-500"></span>
      </div>
      <div id="videos" class="space-y-10"></div>
      <p id="empty" class="hidden py-20 text-center text-slate-500">No videos found.</p>
    </section>
  </main>

  </div><!-- /view-browse -->

  <!-- SPA view: player (hidden by default; populated by SPA migration) -->
  <div id="view-player" style="display:none">
<header class="flex items-center gap-3 border-b border-slate-800 px-4 py-3">
      <button id="pvSidebarLogo" title="Open sidebar" style="align-items:center;gap:8px;padding:6px 12px;border-radius:10px;background:transparent;border:none;cursor:pointer;color:#a5b4fc;font-weight:700;font-size:15px"><span class="material-symbols-outlined" style="color:#818cf8">play_circle</span>VidMe</button>
      <a href="/" id="btn-goback" class="ml-auto flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-slate-800">
        <span class="material-symbols-outlined">arrow_back</span>Back
      </a>
    </header>
<main class="mx-auto max-w-6xl px-4 py-6 md:px-8" style="padding-top:24px">
    <!-- Video container: shrink-wrap -->
    <div class="relative overflow-hidden rounded-2xl bg-black" id="player-wrap" style="width:100%;height:80vh;border:none;outline:none;visibility:hidden;background:#000">
      <!-- Double-tap zones (mobile skip) — left/right 1/3 -->
      <div id="tap-left"  class="absolute top-0 left-0 z-10" style="height:100%;width:calc(33.333% + 1px)"></div>
      <div id="tap-right" class="absolute top-0 right-0 z-10" style="height:100%;width:calc(33.333% + 1px)"></div>
      <!-- Center tap: play/pause — covers middle 1/3, always in DOM -->
      <button id="center-tap" class="absolute top-0 left-1/3 z-20 w-1/3 border-0 p-0 bg-transparent" style="height:100%">
        <div id="play-icon" class="flex items-center justify-center w-full h-full">
          <div class="rounded-full bg-black/60 p-4 pointer-events-none">
            <span id="play-icon-symbol" class="material-symbols-outlined text-white" style="font-size:48px">play_arrow</span>
          </div>
        </div>
      </button>
      <!-- Skip flash indicators -->
      <div id="flash-left"  class="skip-flash" style="left:10%">-5s</div>
      <div id="flash-right" class="skip-flash" style="right:10%">+5s</div>
      <!-- Video -->
      <video id="video" preload="metadata" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#000"></video>
      <div id="vid-loader" style="display:none;position:absolute;inset:0;z-index:25;pointer-events:none;display:flex;align-items:center;justify-content:center;background:transparent">
        <div style="border-radius:9999px;background:rgba(0,0,0,0.6);padding:16px;display:flex;align-items:center;justify-content:center">

<script>
/* vidme-rc5 */
/* vidme-rc3.1 */
/* vidme-rc3 */
const $ = s => document.querySelector(s);
const state = { videos: [], folders: [], folderTree: [], folder: null, selectMode: false, selected: new Set(), uploads: [], suggestions: [] };
// vidme-paging: 16 card/page; page HANYA di Home utama (tanpa folder/search) via ?page=N
const PAGE_SIZE = 20; // vidme-v27: 20 card/page (keputusan user 25-09-26)
state.page = 1;
function _pageParam() {
  const p = parseInt(new URLSearchParams(location.search).get('page'), 10);
  return Number.isFinite(p) && p >= 1 ? p : null;
}
function pageUrl(n) {
  const u = new URL(location.href);
  if (n === null) u.searchParams.delete('page'); else u.searchParams.set('page', String(n));
  return u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : '');
}
function clampPage(totalPages) { if (state.page > totalPages) state.page = totalPages; if (state.page < 1) state.page = 1; }
// vidme-suggested: managed server-side via /api/suggestions (round-robin deck, zero-lock JSON)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":' &#39;'}[c]));
function slugify(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
// vidme-library: openVideo ikutkan konteks folder virtual → URL /library/<view>/v/:id (22-09-26)
function openVideo(videoId, folderId) {
  try { sessionStorage.setItem('vidme-player-return', location.pathname + location.search); } catch (e) {} // vidme-v28b: asal SEBELUM pushState
  let ctx = folderId || '';
  if (state.folder === '__portrait__' || state.folder === '__landscape__' || state.folder === 'null') ctx = state.folder;
  if (ctx === '__portrait__') return Router.navigate('/library/portrait/v/' + encodeURIComponent(videoId));
  if (ctx === '__landscape__') return Router.navigate('/library/landscape/v/' + encodeURIComponent(videoId));
  if (ctx === 'null') return Router.navigate('/library/uncategorized/v/' + encodeURIComponent(videoId));
  const f = ctx ? state.folders.find(x => x.id === ctx) : null;
  const s = f ? slugify(f.name) : '';
  Router.navigate(s ? '/' + s + '/v/' + encodeURIComponent(videoId) : '/v/' + encodeURIComponent(videoId));
}
async function api(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw Error(await r.text()); return r.json(); }

// ── IndexedDB persistence for upload resume (survives SW/OS kill) ──
const IDB_NAME = 'vidme-uploads', IDB_STORE = 'uploads';
function idbOpen() { return new Promise((res, rej) => { const r = indexedDB.open(IDB_NAME, 1); r.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE); r.onsuccess = e => res(e.target.result); r.onerror = e => rej(e.target.error); }); }
async function idbGetAll() { const db = await idbOpen(); return new Promise((res, rej) => { const r = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { const db = await idbOpen(); return new Promise((res, rej) => { const r = db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbPut(k, v) { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
async function idbDel(k) { const db = await idbOpen(); return new Promise((res, rej) => { const tx = db.transaction(IDB_STORE,'readwrite'); tx.objectStore(IDB_STORE).delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }


// ── Folder tree helpers ──
function flattenFolders(tree, depth = 0) {
  let flat = [];
  (tree || []).forEach(f => {
    flat.push({ id: f.id, name: f.name, video_count: f.video_count, parent_id: f.parent_id, depth });
    if (f.children && f.children.length) flat = flat.concat(flattenFolders(f.children, depth + 1));
  });
  return flat;
}

// ── Mobile Library Panel ──
function toggleLibraryPanel() {
  const p = $('#libraryPanel');
  if (p.classList.contains('hidden')) {
    p.classList.replace('hidden', 'flex');
    renderLibraryPanel();
    requestAnimationFrame(() => p.classList.remove('translate-y-full'));
  } else {
    p.classList.add('translate-y-full');
    setTimeout(() => p.classList.replace('flex', 'hidden'), 300);
  }
}
function selectFolder(id) {
  state.folder = id || null;
  state.page = 1; // vidme-paging
  if (_pageParam()) history.replaceState({}, '', pageUrl(null));
  if (state.folder === 'null') $('#heading').textContent = 'Uncategorized';
  else if (state.folder === '__portrait__') $('#heading').textContent = 'Portrait';
  else if (state.folder === '__landscape__') $('#heading').textContent = 'Landscape';
  else {
    const folder = state.folders.find(f => f.id === id);
    $('#heading').textContent = folder ? folder.name : 'All videos';
  }
  if (state.folder === '__portrait__') {
    history.pushState({}, '', '/library/portrait/'); // vidme-library
  } else if (state.folder === '__landscape__') {
    history.pushState({}, '', '/library/landscape/');
  } else if (state.folder === 'null') {
    history.pushState({}, '', '/library/uncategorized/');
  } else if (state.folder && !state.folder.startsWith('__')) {
    const _f = state.folders.find(f => f.id === state.folder);
    history.pushState({}, '', '/' + slugify(_f ? _f.name : state.folder) + '/');
  } else {
    history.pushState({}, '', '/');
  }
  render();
  requestAnimationFrame(() => window.scrollTo(0, 0));
  toggleLibraryPanel();
}
function uncategorizedCount() {
  return state.videos.filter(v => !v.folder_id).length;
}
function renderLibraryPanel() {
  const totalCount = state.videos.length;
  const uncCount = uncategorizedCount();
  let html = `<button onclick="selectFolder('')" class="flex w-full items-center gap-3 px-4 py-3 hover:bg-slate-800 border-b border-slate-800">
    <span class="material-symbols-outlined text-indigo-300">video_library</span>
    <span class="flex-1 text-left font-medium">All Videos</span>
    <span class="rounded-full bg-slate-700 px-2 py-0.5 text-xs">${totalCount}</span>
  </button>`;
  html += `<button onclick="selectFolder('null')" class="flex w-full items-center gap-3 px-4 py-3 hover:bg-slate-800 border-b border-slate-800">
    <span class="material-symbols-outlined text-slate-400">folder_off</span>
    <span class="flex-1 text-left">Uncategorized</span>
    <span class="rounded-full bg-slate-700 px-2 py-0.5 text-xs text-slate-300">${uncCount}</span>
  </button>`;
  const portraitCount = state.videos.filter(v => v.is_portrait).length;
  html += `<button onclick="selectFolder('__portrait__')" class="flex w-full items-center gap-3 px-4 py-3 hover:bg-slate-800 border-b border-slate-800">
    <span class="material-symbols-outlined text-indigo-300">stay_current_portrait</span>
    <span class="flex-1 text-left">Portrait</span>
    <span class="rounded-full bg-slate-700 px-2 py-0.5 text-xs">${portraitCount}</span>
  </button>`;
  html += `<button onclick="selectFolder('__landscape__')" class="flex w-full items-center gap-3 px-4 py-3 hover:bg-slate-800 border-b border-slate-800">
    <span class="material-symbols-outlined text-indigo-300">stay_current_landscape</span>
    <span class="flex-1 text-left">Landscape</span>
    <span class="rounded-full bg-slate-700 px-2 py-0.5 text-xs">${state.videos.length - portraitCount}</span>
  </button>`;
  function renderItem(f, depth) {
    const icon = depth > 0 ? 'subdirectory_arrow_right' : 'folder';
    const pad = 16 + depth * 20;
    let h = `<div class="flex w-full items-center border-b border-slate-800 hover:bg-slate-800" style="padding-left:${pad}px">
      <button onclick="selectFolder('${f.id}')" class="flex flex-1 items-center gap-3 py-3 px-4 text-left">
        <span class="material-symbols-outlined text-slate-400">${icon}</span>
        <span class="flex-1">${esc(f.name)}</span>
        <span class="rounded-full bg-slate-700 px-2 py-0.5 text-xs text-slate-300">${f.video_count}</span>
      </button>
      <button onclick="event.stopPropagation();showCtxMenu(event,'${f.id}')" class="px-3 py-2 text-slate-500 hover:text-slate-200"><span class="material-symbols-outlined" style="font-size:18px">more_vert</span></button>
    </div>`;
    if (f.children) h += f.children.map(c => renderItem(c, depth + 1)).join('');
    return h;
  }
  html += (state.folderTree || []).map(f => renderItem(f, 0)).join('');
  $('#libraryList').innerHTML = html;
}

// ── Folder context menu + actions ──
function showCtxMenu(e, folderId) {
  const menu = $('#ctxMenu');
  const folder = state.folders.find(f => f.id === folderId);
  if (!folder) return;
  menu.innerHTML = `
    <button class="ctx-item flex items-center gap-3 px-4 py-2.5 text-sm hover:bg-slate-800" onclick="renameFolder('${folderId}')"><span class="material-symbols-outlined" style="font-size:18px">edit</span>Rename</button>
    <button class="ctx-item flex items-center gap-3 px-4 py-2.5 text-sm hover:bg-slate-800" onclick="moveFolder('${folderId}')"><span class="material-symbols-outlined" style="font-size:18px">drive_file_move</span>Move to folder</button>
    <div class="my-1 border-t border-slate-700"></div>
    <button class="ctx-item flex items-center gap-3 px-4 py-2.5 text-sm text-red-400 hover:bg-slate-800" onclick="deleteFolder('${folderId}')"><span class="material-symbols-outlined" style="font-size:18px">delete</span>Delete</button>`;
  menu.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
  menu.style.top = Math.min(e.clientY, window.innerHeight - 160) + 'px';
  menu.classList.remove('hidden');

async function deleteFolder(id) {
  const folder = state.folders.find(f => f.id === id);
  if (!folder) return;
  const hasVideos = folder.video_count > 0;
  const hasChildren = state.folders.some(f => f.parent_id === id);
  let url = `/api/folders/${id}`;
  if (hasVideos || hasChildren) {
    const parts = [];
    if (hasVideos) parts.push(`${folder.video_count} video${folder.video_count===1?'':'s'}`);
    if (hasChildren) parts.push('subfolders');
    const ok = await showConfirm('Delete folder', `"${folder.name}" has ${parts.join(' and ')}.\n\nClick Delete to move them to Uncategorized, or Cancel to abort.`);
    if (!ok) return;
    url += '?orphan_action=unassign';
  }
  await fetch(url, { method: 'DELETE' });
  toast(`Folder "${folder.name}" deleted`, 'success');
  if (state.folder === id) { state.folder = null; $('#heading').textContent = 'All videos'; }
  await load();
}

function toast(msg, type = 'info', duration = 4000) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="flex:1">${msg}</span><button onclick="this.parentElement.remove()" style="opacity:.6;font-size:18px;line-height:1;background:none;border:none;color:inherit;cursor:pointer">&times;</button>`;
  $('#toastContainer').appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
  if (duration > 0) setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, duration);
  return el;
}

// ── Draggable upload modal ──
(function() {
  const card = document.getElementById('uploadForm');
  const header = document.getElementById('modalHeader');
  const overlay = document.getElementById('modal');
  let dragging = false, sx, sy, sl, st;
  // Close on backdrop click
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  function start(clientX, clientY) {
    dragging = true;
    const rect = card.getBoundingClientRect();
    card.style.transform = 'none';
    sl = rect.left; st = rect.top;
    card.style.left = sl + 'px';
    card.style.top = st + 'px';
    sx = clientX; sy = clientY;
  }
  function move(clientX, clientY) {
    if (!dragging) return;
    let nl = sl + (clientX - sx), nt = st + (clientY - sy);
    const cw = card.offsetWidth, ch = card.offsetHeight;
    nl = Math.max(0, Math.min(nl, window.innerWidth - cw));
    nt = Math.max(0, Math.min(nt, window.innerHeight - ch));
    card.style.left = nl + 'px';
    card.style.top = nt + 'px';
  }
  function end() { dragging = false; }
  header.addEventListener('mousedown', e => { start(e.clientX, e.clientY); e.preventDefault(); });
  document.addEventListener('mousemove', e => move(e.clientX, e.clientY));
  document.addEventListener('mouseup', end);
  header.addEventListener('touchstart', e => { const t = e.touches[0]; start(t.clientX, t.clientY); }, { passive: true });
  document.addEventListener('touchmove', e => { if (dragging) { e.preventDefault(); const t = e.touches[0]; move(t.clientX, t.clientY); } }, { passive: false });
  document.addEventListener('touchend', end);
})();

// ETA + speed: dari speed EMA (bytes/sec) yang dikirim SW; fallback hitung dari bytesSent/waktu lokal
function fmtEta(sec) {
  if (!isFinite(sec) || sec <= 0) return '';
  sec = Math.round(sec);
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'm ' + String(sec%60).padStart(2,'0') + 's';
  return Math.floor(sec/3600) + 'h ' + String(Math.floor((sec%3600)/60)).padStart(2,'0') + 'm';
}
// 19-09-26 (Opsi 2): chunk tetap 4MB, tapi ETA di-interpolasi tiap detik.
// Anchor: (a) bytesSent dari SW = benar tapi hanya di akhir chunk (~16s @2Mbps);
// (b) selama menunggu, "sent" = anchorSent + speed*(elapsed) — angka estimasi yang
// dikoreksi begitu chunk berikutnya landing. Pola sama dipakai FileBrowser/Seafile
// (hitung kecepatan dari delta, tampilkan di interval tetap) — bedanya mereka punya
// XHR upload.onprogress, kita tidak (fetch di SW tanpa event progress).
function etaHtml(u) {
  const anchorSent = u.bytesSent ?? 0, total = u.bytesTotal ?? 0;
  if (!total || !anchorSent || anchorSent >= total) return '';
  const now = Date.now();
  const spd = u.speed || 0;                     // bytes/sec dari SW (EMA, di-update per chunk)
  if (!spd) return '';
  // interpolasi: anchor terakhir + kecepatan x waktu berjalan sejak anchor
  const dt = u._anchorAt ? (now - u._anchorAt) / 1000 : 0;
  let shown = Math.min(anchorSent + spd * dt, total);
  const eta = (total - shown) / spd;
  const mbs = (spd / 1048576).toFixed(2);
  return ` &bull; ${mbs} MB/s &bull; ETA ${fmtEta(eta)}`;
}
// 19-09-26 (FileBrowser pattern): SW broadcasts ~10-20x/s on slow links; repainting
// the panel that often wastes main-thread time and starves the hover preview.
// Mark dirty and let a 1s tick repaint; while any upload is active the tick keeps
// running so the INTERPOLATED ETA advances even between 4MB chunks (~16s @2Mbps).
let _ucDirty = false, _ucTimer = null;
function markUploadsDirty() {
  _ucDirty = true;
  if (_ucTimer) return;
  _ucTimer = setInterval(() => {
    const hasActive = state.uploads.some(u => u.status === 'uploading');
    if (!_ucDirty && !hasActive) { clearInterval(_ucTimer); _ucTimer = null; return; }
    _ucDirty = false;
    renderUploadCenter();
  }, 1000);
}
function renderUploadCenter() {

function cancelUpload(id) { // vidme-mupload: queued = keluar antrian; aktif = cancel SW seperti biasa
  const u = state.uploads.find(x => x.id === id);
  if (!u) return;
  if (u.status === 'queued') {
    uploadQueue = uploadQueue.filter(x => x !== id);
    _idbQueue = _idbQueue.filter(r => r.uploadId !== id);
    u.status = 'cancelled'; u.timestamp = Date.now(); renderUploadCenter();
    idbDel(id).catch(()=>{});
    return;
  }
  navigator.serviceWorker?.controller?.postMessage({ type: 'sw-upload-cancel', uploadId: id }); u.status = 'cancelled'; u.timestamp = Date.now(); renderUploadCenter();
}

  state.uploads = state.uploads.filter(u => u.status === 'uploading');

// vidme-bugfix-1021: reconcile uploads against server state
// Kalau ada item upload yg masih 'uploading'/'queued' di client tapi video-nya
// sudah ready di server (by title match), otomatis tandai done & hapus dari IDB.
function reconcileUploads() {
  if (!state.uploads.length || !state.videos.length) return;
  let changed = false;
  state.uploads.forEach(u => {
    if (u.status !== 'uploading' && u.status !== 'queued') return;
    const match = state.videos.find(v =>
      v.status === 'ready' &&
      v.title && u.title &&
      v.title.toLowerCase() === u.title.toLowerCase()
    );
    if (match) {
      u.status = 'done'; u.progress = 100; u.timestamp = Date.now();
      idbDel(u.id).catch(() => {});
      changed = true;
    }
  });
  if (changed) { updateUploadBadge(); renderUploadCenter(); }
}

function fmt(n) { const h = Math.floor(n/3600); const m = Math.floor((n%3600)/60); const s = Math.floor(n%60); return h ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`; }

// vidme-paging: bar [‹‹] 1 … cur±2 … N [››] + counter; CSS hand-written (tailwind subset tak punya kelasnya)
function paginationBar(cur, total) { // vidme-v27: paginationBar w3-style ❮ 1 … N ❯
  if (total <= 1) return '';
  const set = new Set();
  for (let p = 1; p <= Math.min(7, total); p++) set.add(p);
  set.add(total);
  [cur - 1, cur, cur + 1].forEach(p => { if (p >= 1 && p <= total) set.add(p); });
  const pages = [...set].sort((a, b) => a - b);
  let parts = [];
  let prev = 0;
  for (const p of pages) {
    if (p - prev > 1) parts.push('<span class="pagination__item w3-button w3-text-gray">…</span>');
    if (p === cur) parts.push(`<span class="pagination__item w3-button pagination-active nunito-700" data-page="${p}">${p}</span>`);
    else parts.push(`<a class="w3-button nunito-400 pagination__item" data-page="${p}" href="${pageUrl(p)}">${p}</a>`);
    prev = p;
  }
  const prevBtn = cur <= 1
    ? `<span class="pagination__item pagination__item--previous-page w3-button w3-disabled pagination-disabled">❮</span>`
    : `<a class="w3-button nunito-400 pagination__item pagination__item--previous-page" data-page="${cur - 1}" href="${pageUrl(cur - 1)}" rel="prev">❮</a>`;
  const nextBtn = cur >= total
    ? `<span class="pagination__item pagination__item--next-page w3-button w3-disabled pagination-disabled">❯</span>`
    : `<a class="w3-button nunito-400 pagination__item pagination__item--next-page" data-page="${cur + 1}" href="${pageUrl(cur + 1)}" rel="next">❯</a>`;
  return `<nav class="pagination-wrapper" data-total="${total}" aria-label="Pagination Navigation"> <!-- vidme-v27: wrapper data-total --><div class="w3-bar w3-center j-pagination">${prevBtn}${parts.join('')}${nextBtn}</div></nav>`;
}

  // plafon 15 menit supaya job preview yang mati tidak nge-poll selamanya.

  if (!_vidSettled(n) && age < 15 * 60 * 1000) {   // bukan untuk video yang sudah settled
    const delay = age < 60 * 1000 ? 3000 : (age < 5 * 60 * 1000 ? 5000 : 10000);
    setTimeout(() => poll(n), delay);
  } else if (_vidSettled(n) && !wasSettled) {
    toast(`✓ <b>${esc(n.title)}</b> siap`, 'success');
  }
}

// ── vidme-codecgate: client-side codec pre-detection (baca head+tail ~1MB, TANPA upload) (22-09-26) ──
function detectVideoCodec(file) {
  const ext = (file.name || '').split('.').pop().toLowerCase();
  const R = c => ({ ok: false, codec: c });
  if (ext === 'webm') return Promise.resolve(R('WebM (VP8/VP9/AV1)'));
  if (ext === 'wmv') return Promise.resolve(R('WMV'));
  if (!['mp4','mov','m4v','3gp','mkv','avi','ts','flv'].includes(ext)) return Promise.resolve(R(ext.toUpperCase()));
  const HEAD = 1024 * 1024, TAIL = 1024 * 1024;
  const parts = [file.slice(0, Math.min(HEAD, file.size))];
  if (file.size > HEAD) parts.push(file.slice(Math.max(HEAD, file.size - TAIL)));
  return Promise.all(parts.map(p => new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(new Uint8Array(fr.result));
    fr.onerror = () => res(null);
    fr.readAsArrayBuffer(p);
  }))).then(chunks => {
    if (chunks.some(c => c === null)) return R('file tidak terbaca');
    let bin = '';
    for (const c of chunks) for (let i = 0; i < c.length; i++) bin += String.fromCharCode(c[i]);
    if (ext === 'mkv') {
      if (bin.includes('V_MPEG4/ISO/AVC')) return { ok: true, codec: 'h264' };
      if (bin.includes('V_MPEGH/ISO/HEVC')) return R('HEVC');
      if (bin.includes('V_AV1')) return R('AV1');
      if (bin.includes('V_VP9')) return R('VP9');
      if (bin.includes('V_VP8')) return R('VP8');
      return R('tidak terdeteksi di MKV');
    }
    if (ext === 'avi') {
      if (/avc1|h264|H264/.test(bin)) return { ok: true, codec: 'h264' };
      if (/XVID|DIVX|DX50|MP4V/i.test(bin)) return R('MPEG-4/XviD');
      return R('tidak terdeteksi di AVI');
    }
    if (ext === 'flv') {
      if (bin.includes('avc1')) return { ok: true, codec: 'h264' };
      if (bin.includes('hvc1')) return R('HEVC');
      return R('tidak terdeteksi di FLV');
    }
    if (ext === 'ts') {
      const st = tsStreamTypes(bin);
      if (st.h264) return { ok: true, codec: 'h264' };
      if (st.hevc) return R('HEVC');
      if (st.av1) return R('AV1');
      return R('tidak terdeteksi di TS');
    }
    // mp4-family: scan fourcc di head+tail (moov bisa di depan atau belakang file)
    const FAIL = [['hvc1','HEVC'],['hev1','HEVC'],['dvh1','HEVC (Dolby)'],['dva1','AV1'],['av01','AV1'],['vp09','VP9'],['vp08','VP8'],['mp4v','MPEG-4 Visual'],['xvid','XviD'],['divx','DivX'],['dx50','DivX']];
    for (const [f, label] of FAIL) if (bin.includes(f)) return R(label);
    if (bin.includes('avc1') || bin.includes('avc3') || bin.includes('avc4') || bin.includes('h264')) return { ok: true, codec: 'h264' };
    return R('tidak terdeteksi');
  });
}
// TS: parse PAT→PMT, kumpulkan stream_type video
function tsStreamTypes(bin) {
  const out = { h264: false, hevc: false, av1: false };
  const at = i => bin.charCodeAt(i) & 0xff;
  let pmtPids = [];
  for (let off = 0; off + 188 <= bin.length; off += 188) {
    if (at(off) !== 0x47) continue;
    const pusi = !!(at(off + 1) & 0x40);
    const pid = ((at(off + 1) & 0x1f) << 8) | at(off + 2);
    if (!pusi) continue;
    const afc = (at(off + 3) >> 4) & 0x3;
    let p = off + 4;
    if (afc & 0x2) { p += 1 + at(p); }
    if ((afc & 0x1) === 0) continue;
    const pointer = at(p); p += 1 + pointer;
    const tableId = at(p);
    if (tableId === 0x00) {
      const sectionLen = ((at(p + 1) & 0x0f) << 8) | at(p + 2);
      const end = p + 3 + sectionLen - 4;
      for (let q = p + 8; q + 4 <= end; q += 4) {
        const prog = (at(q) << 8) | at(q + 1);
        const pnum = ((at(q + 2) & 0x1f) << 8) | at(q + 3);
        if (prog !== 0 && pnum) pmtPids.push(pnum);
      }
    } else if (tableId === 0x02 && pmtPids.includes(pid)) {
      const sectionLen = ((at(p + 1) & 0x0f) << 8) | at(p + 2);
      const pil = ((at(p + 10) & 0x0f) << 8) | at(p + 11);
      const end = p + 3 + sectionLen - 4;
      for (let q = p + 12 + pil; q + 5 <= end; ) {
        const st = at(q);
        const esLen = ((at(q + 3) & 0x0f) << 8) | at(q + 4);
        if (st === 0x1b) out.h264 = true;
        if (st === 0x24) out.hevc = true;
        if (st === 0x35) out.av1 = true;
        q += 5 + esLen;
      }
    }
  }
  return out;
}

let uploadQueue = [];

const UPLOAD_CONCURRENCY = 2;
function pumpQueue() {
  const sw = navigator.serviceWorker?.controller;
  if (!sw) return;
  while (_activeUploads < UPLOAD_CONCURRENCY && uploadQueue.length) {
    const id = uploadQueue.shift();
    const u = state.uploads.find(x => x.id === id);
    const rec = _idbQueue.find(r => r.uploadId === id);
    if (!u || u.status !== 'queued' || !rec) continue; // cancelled sebelum start
    u.status = 'uploading';
    sw.postMessage({ type: 'sw-upload-start', uploadId: id, file: rec.file, title: u.title, folderId: rec.folderId, filename: rec.filename });
    _activeUploads++;
  }
  markUploadsDirty();
}

// ── Unified hover/tap preview — main file montase /clip (4/6 segmen, di-encode FFmpeg) ──
// Desktop: hover 250ms → play loop montase; leave → STOP immediate. Mobile (hover:none): tap 1 = preview, tap 2 = open.
(function() {
  const container = document.getElementById('videos');
  if (!container) return;

  let openTimer = null;
  let activeCard = null;
  let activeVideo = null;

  function stopPreview() {
    if (openTimer) { clearTimeout(openTimer); openTimer = null; }
    if (activeVideo) {
      activeVideo.pause();
      activeVideo.removeAttribute('src');
      activeVideo.load();
      activeVideo.remove();
      activeVideo = null;
    }
    activeCard = null;
  }

  // 19-09-26: montase per video is immutable — keep the blob URL in memory so a re-hover
  // is instant instead of a fresh ~300KB download (which on a busy/slow link made hover
  // look dead while an upload saturated the uplink).
  const _clipCache = new Map();   // videoId -> objectURL
  async function showPreview(card) {
    const frame = card.querySelector('div.relative');
    if (!frame || !card.dataset.clip) return;
    const clipId = card.dataset.clip;
    const vid = document.createElement('video');
    vid.className = 'absolute inset-0 h-full w-full'; vid.style.objectFit = 'contain'; vid.style.background = '#050507'; // letterbox: landscape utuh
    vid.muted = true; vid.loop = true; vid.playsInline = true; vid.preload = 'none';
    frame.appendChild(vid);
    activeCard = card;
    activeVideo = vid;
    let src = _clipCache.get(clipId);
    if (!src) {
      try {
        const r = await fetch('/clip/' + clipId);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        src = URL.createObjectURL(await r.blob());
        _clipCache.set(clipId, src);
      } catch (e) { return; }
    }
    if (activeVideo !== vid) return;             // user already moved on
    vid.src = src;
    vid.play().catch(() => {});
  }

  const isTouchPrimary = () => matchMedia('(hover: none)').matches;

  // Desktop hover — stop immediate saat pindah/keluar kartu
  container.addEventListener('mouseover', (e) => {
    const card = e.target.closest('.video-card');
    if (card === activeCard) return; // synthetic mouseover pas tap: jangan hancurin preview
    stopPreview();
    if (!card || state.selectMode || isTouchPrimary()) return;
    openTimer = setTimeout(() => showPreview(card), 250);
  });
  container.addEventListener('mouseleave', () => stopPreview());
  window.stopPreview = stopPreview;   // 19-09-26: SSE handler + render() call this

  // Touch: tap 1 = preview montase (~300KB), tap 2 di kartu sama = buka player
  container.addEventListener('click', (e) => {
    if (!isTouchPrimary() || state.selectMode) return;
    const card = e.target.closest('.video-card');
    if (!card) return;
    if (!card.dataset.clip) return; // gak ada montase → biarkan tap navigate normal
    if (activeCard === card) {
      e.preventDefault();
      e.stopPropagation();
      stopPreview();
      openVideo(card.dataset.id, card.dataset.folderId);
      return;
    }
    e.preventDefault();
    e.stopPropagation();
    stopPreview();
    showPreview(card);
  }, true); // capture — intercept sebelum article onclick
})();

const Router = {
  parseRoute() {

      return { view: 'player', videoId: parts[1], folderId: null };
    }
    // vidme-library: /library/:view — virtual browse (22-09-26)
    if (parts.length === 2 && parts[0] === 'library') {
      const vmap = { portrait: '__portrait__', landscape: '__landscape__', uncategorized: 'null' };
      if (vmap[parts[1]]) return { view: 'browse', folderId: vmap[parts[1]] };
    }

    if (parts.length === 4 && parts[0] === 'library' && parts[2] === 'v') {

      return { view: 'player', videoId: parts[3], folderId: vmap[parts[1]] || null };
    }
    // /:folderSlug/v/:videoId

  }
  function playWithSound() {
    vid.muted = false;
    document.getElementById("volume").value = vid.volume || 1;
    vid.paused ? vid.play().catch(() => {}) : vid.pause();
  }
  function flash(el) {
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 600);
  }
  function skip(sec) {
    const side = sec < 0 ? "left" : "right";
    const el = document.getElementById(sec < 0 ? "flash-left" : "flash-right");
    clearTimeout(_skipAcc.timer);
    _skipAcc[side] += sec;
    el.textContent = (_skipAcc[side] > 0 ? "+" : "") + _skipAcc[side] + "s";
    flash(el);
    _skipAcc.timer = setTimeout(() => { _skipAcc.left = 0; _skipAcc.right = 0; }, 800);
    vid.currentTime = Math.max(0, Math.min(vid.duration || 0, vid.currentTime + sec));
  }
  function handleTap(side) {
    showControls();
    if (!vid.paused) scheduleHide(3000);
    const now = Date.now();
    if (side === "left") {
      if (now - lastTapLeft < 300) { skip(-5); flash(document.getElementById("flash-left")); lastTapLeft = 0; }
      else lastTapLeft = now;
    } else {
      if (now - lastTapRight < 300) { skip(5); flash(document.getElementById("flash-right")); lastTapRight = 0; }
      else lastTapRight = now;
    }
  }
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else (wrap.requestFullscreen && wrap.requestFullscreen()) || (wrap.webkitRequestFullscreen && wrap.webkitRequestFullscreen());
  }
  function updatePinBtn() {
    const pinned = !!pvMetadata.is_pinned;
    const btn = document.getElementById("btn-pin");
    btn.classList.toggle("border-indigo-400", pinned);
    btn.classList.toggle("text-indigo-300", pinned);
    btn.innerHTML = '<span class="material-symbols-outlined align-middle">push_pin</span> ' + (pinned ? "Pinned" : "Pin");
  }
  async function togglePin() {
    const next = !pvMetadata.is_pinned;
    const r = await fetch("/api/videos/" + encodeURIComponent(pvId) + "/pin", {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ is_pinned: next })
    });
    if (r.ok) { pvMetadata.is_pinned = next; updatePinBtn(); }
  }
  function enterEdit() {
    const titleEl = document.getElementById("title");
    const titleInput = document.getElementById("videoTitleInput");
    const editBtn = document.getElementById("btn-edit-title");
    titleInput.value = pvMetadata.title;
    titleEl.classList.add("hidden");
    editBtn.classList.add("hidden");
    titleInput.classList.remove("hidden");
    titleInput.focus(); titleInput.select();
  }
  async function commitEdit() {
    const titleEl = document.getElementById("title");
    const titleInput = document.getElementById("videoTitleInput");
    const editBtn = document.getElementById("btn-edit-title");
    const newTitle = titleInput.value.trim();
    titleInput.classList.add("hidden");
    titleEl.classList.remove("hidden");
    editBtn.classList.remove("hidden");
    if (!newTitle || newTitle === pvMetadata.title) { titleEl.textContent = pvMetadata.title; return; }
    const r = await fetch("/api/videos/" + encodeURIComponent(pvId), {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title: newTitle })
    });
    if (r.ok) { pvMetadata.title = newTitle; titleEl.textContent = newTitle; document.title = newTitle + " — VidMe"; localStorage.setItem("vidme_refresh", "1"); }
    else titleEl.textContent = pvMetadata.title;
  }
  function setup() {
    const portrait = !!pvMetadata.is_portrait;
    document.title = pvMetadata.title + " — VidMe";
    document.getElementById("title").textContent = pvMetadata.title;
    document.getElementById("date").textContent = new Date(pvMetadata.created_at).toLocaleString();
    document.getElementById("btn-download").href = "/download/" + encodeURIComponent(pvId);
    updatePinBtn();
    document.getElementById("resolution").innerHTML =
      '<option value="original">Original</option>' +
      (pvMetadata.has_480p ? '<option value="480">' + (portrait ? "480w" : "480p") + '</option>' : "") +
      (pvMetadata.has_360p ? '<option value="360">' + (portrait ? "360w" : "360p") + '</option>' : "");
    document.getElementById("resolution").value = pvMetadata.has_480p ? "480" : "original";
    if (vid.readyState < 3) showLoader();
    wrap.style.visibility = "visible";
    vid.poster = "/thumb/" + encodeURIComponent(pvId);
    vid.src = "/stream/" + encodeURIComponent(pvId);
    vid.muted = true;
    vid.load();
  }

  // ── Media event listeners (bound once — element persists in SPA) ──
  vid.addEventListener("waiting", showLoader);
  vid.addEventListener("seeking", showLoader);
  vid.addEventListener("canplay", hideLoader);
  vid.addEventListener("playing", hideLoader);
  vid.addEventListener("ended", hideLoader);
  vid.addEventListener("play", () => {
    playIcon.style.opacity = "0";
    document.getElementById("btn-play").innerHTML = '<span class="material-symbols-outlined">pause</span>';
    if (!mouseInside) scheduleHide(2500);
  });
  vid.addEventListener("pause", () => {
    clearTimeout(controlsTimer);
    playIcon.style.opacity = "1";
    playIconSymbol.textContent = "play_arrow";
    document.getElementById("btn-play").innerHTML = '<span class="material-symbols-outlined">play_arrow</span>';
    showControls();
  });
  vid.ontimeupdate = () => {
    if (pvActive && !isNaN(vid.duration)) {
      document.getElementById("seek").value = vid.currentTime;
      document.getElementById("time").textContent = fmt(vid.currentTime) + " / " + fmt(vid.duration);
    }
  };
  vid.onloadedmetadata = () => {
    if (!pvActive) return;
    document.getElementById("seek").max = vid.duration;
    document.getElementById("time").textContent = "0:00 / " + fmt(vid.duration);
  };

  // ── Control element bindings (bound once) ──
  wrap.addEventListener("mouseenter", () => { mouseInside = true; showControls(); });
  wrap.addEventListener("mouseleave", () => { mouseInside = false; if (!vid.paused) scheduleHide(200); });
  wrap.addEventListener("mousemove", () => { showControls(); if (!vid.paused) scheduleHide(3000); });
  centerTap.addEventListener("touchend", (e) => {
    e.preventDefault();
    touchHandled = true;
    playWithSound();
    showControls();
    if (!vid.paused) scheduleHide(3000);
  }, { passive: false });
  centerTap.addEventListener("click", () => {
    if (touchHandled) { touchHandled = false; return; }
    playWithSound();
    showControls();
    if (!vid.paused) scheduleHide(3000);
  });
  document.getElementById("btn-back").onclick = () => skip(-5);
  document.getElementById("btn-fwd").onclick = () => skip(5);
  document.getElementById("tap-left").addEventListener("touchend", () => { lastTouchEnd = Date.now(); handleTap("left"); }, { passive: true });
  document.getElementById("tap-right").addEventListener("touchend", () => { lastTouchEnd = Date.now(); handleTap("right"); }, { passive: true });
  document.getElementById("tap-left").addEventListener("dblclick", e => { if (Date.now() - lastTouchEnd < 500) return; skip(-5); flash(document.getElementById("flash-left")); });
  document.getElementById("tap-right").addEventListener("dblclick", e => { if (Date.now() - lastTouchEnd < 500) return; skip(5); flash(document.getElementById("flash-right")); });
  document.getElementById("seek").oninput = e => { vid.currentTime = Number(e.target.value); };
  document.getElementById("btn-play").onclick = playWithSound;
  document.getElementById("volume").oninput = e => {
    vid.volume = Number(e.target.value);
    vid.muted = vid.volume === 0;
  };
  document.getElementById("btn-full").onclick = toggleFullscreen;
  document.getElementById("btn-loop").onclick = () => {
    vid.loop = !vid.loop;
    document.getElementById("btn-loop").classList.toggle("border-indigo-400", vid.loop);
    document.getElementById("btn-loop").classList.toggle("text-indigo-300", vid.loop);
  };
  document.getElementById("resolution").onchange = () => {
    const t = vid.currentTime;
    vid.src = "/stream/" + encodeURIComponent(pvId);
    vid.load();
    vid.addEventListener("loadedmetadata", () => { vid.currentTime = t; }, { once: true });
  };
  document.getElementById("btn-pin").onclick = togglePin;
  document.getElementById("btn-edit-title").onclick = enterEdit;
  document.getElementById("videoTitleInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
  document.getElementById("videoTitleInput").addEventListener("blur", commitEdit);
  // Back button: SPA navigate to parent folder or home
  document.getElementById("btn-goback").onclick = e => {
    e.preventDefault();
    let _ret = null; try { _ret = sessionStorage.getItem('vidme-player-return'); sessionStorage.removeItem('vidme-player-return'); } catch (e) {} // vidme-v28
    if (_ret && _ret !== location.pathname + location.search) { Router.navigate(_ret); return; } // vidme-v28: balik ke asal (pages/search/folder)
    const parts = location.pathname.split("/").filter(Boolean);
    const vi = parts.indexOf("v");
    const parent = vi > 0 ? "/" + parts.slice(0, vi).join("/") + "/" : "/";
    Router.navigate(parent);
  };

  // ── Document-level listeners: registered ONCE, guarded by pvActive ──
  document.addEventListener("keydown", e => {
    if (!pvActive) return;
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === " " || e.key.toLowerCase() === "k") { e.preventDefault(); playWithSound(); }
    if (e.key.toLowerCase() === "f") { e.preventDefault(); toggleFullscreen(); }
    if (e.key === "ArrowLeft") { e.preventDefault(); skip(-5); }
    if (e.key === "ArrowRight") { e.preventDefault(); skip(5); }
  });
  document.addEventListener("fullscreenchange", () => {
    if (!pvActive) return;
    const icon = document.fullscreenElement ? "fullscreen_exit" : "fullscreen";
    document.getElementById("btn-full").innerHTML = '<span class="material-symbols-outlined">' + icon + '</span>';
    if (document.fullscreenElement) {
      if (vid.videoWidth > vid.videoHeight) { try { screen.orientation.lock("landscape"); } catch (e) {} }
      else { try { screen.orientation.lock("portrait"); } catch (e) {} }
    } else {
      try { screen.orientation.unlock(); } catch (e) {}
    }
    showControls();
    if (!vid.paused) scheduleHide(3000);
  });

  return {
    async enter(videoId, folderId) {
      pvActive = true;
      pvId = videoId;
      try {
        const r = await fetch("/api/videos/" + encodeURIComponent(videoId));
        if (!r.ok) throw new Error("not found");
        pvMetadata = await r.json();
        setup();
      } catch (err) {
        Router.navigate("/");
      }
    },
    async exit() {
      pvActive = false;
      clearTimeout(controlsTimer);
      try { vid.pause(); } catch (e) {}
      vid.removeAttribute("src");
      vid.load();
      if (document.fullscreenElement) { try { document.exitFullscreen(); } catch (e) {} }
      document.title = "VidMe";
    },
    get active() { return pvActive; },
  };
})();

// ── Browser back/forward: restore folder from URL ──
window.onpopstate = () => { Router.renderRoute(); };
history.scrollRestoration = 'manual';
load().catch(console.error);
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js');
  navigator.serviceWorker.addEventListener('message', e => {
    const { type } = e.data;
    if (type === 'sw-upload-progress') {
      const { uploadId, progress, status, lastChunk, totalChunks, bytesSent, bytesTotal } = e.data;
      const u = state.uploads.find(x => x.id === uploadId);
      if (u) { u.progress = progress; u.status = status; if (lastChunk !== undefined) u.lastChunk = lastChunk; if (totalChunks !== undefined) u.totalChunks = totalChunks; if (bytesSent !== undefined) { if (bytesSent !== u.bytesSent) u._anchorAt = Date.now(); u.bytesSent = bytesSent; } if (bytesTotal !== undefined) u.bytesTotal = bytesTotal; if (e.data.speed !== undefined) u.speed = e.data.speed; markUploadsDirty(); }
    }
    if (type === 'sw-upload-done') {
      const { uploadId, success, status: s } = e.data;
      const u = state.uploads.find(x => x.id === uploadId);
      const title = e.data.title || (u ? u.title : uploadId);
      if (u) { u.progress = success ? 100 : u.progress; u.status = s; u.timestamp = Date.now(); renderUploadCenter(); }
      toast(success ? '\u2713 "' + esc(title) + '" uploaded' : '\u2717 Upload failed: ' + esc(title), success ? 'success' : 'error', success ? 4000 : 6000);
      idbDel(uploadId).catch(()=>{});
      _idbQueue = _idbQueue.filter(r => r.uploadId !== uploadId); // vidme-mupload
      if (_activeUploads > 0) _activeUploads--; // vidme-mupload: slot kosong -> isi antrian
      pumpQueue();
      if (success) { load().catch(console.error); }
    }
    if (type === 'sw-upload-status-response') {
      e.data.uploads.forEach(su => {
        if (!state.uploads.find(u => u.id === su.uploadId)) {
          state.uploads.push({ id: su.uploadId, title: su.title || su.uploadId, status: su.status, progress: su.status === 'done' ? 100 : 0, timestamp: su.timestamp || null });
        }
      });
      updateUploadBadge(); renderUploadCenter();
    }
    if (type === 'sw-heartbeat-ack') { swAlive = Date.now(); }
    // 19-09-26: a NEW service worker took control (first load after an update). Reload
    // once so this page runs the matching index.html — otherwise the page keeps stale JS
    // and never opens /api/events (RC1). Guarded by sessionStorage: no reload loops.
    if (type === 'sw-updated-reload') {
      // vidme-rc3: guard lama '1' menempel seumur sesi tab, jadi update BERIKUTNYA tidak
      // pernah memicu reload dan halaman tetap menjalankan JS lama. Sekarang guard-nya
      // versi cache: satu reload per versi SW per sesi tab, bukan satu seumur hidup.
      const _ver = e.data.cache || '1';
      if (sessionStorage.getItem('vidme_sw_reloaded') !== _ver) {
        sessionStorage.setItem('vidme_sw_reloaded', _ver);
        location.reload();
      }
    }
    if (type === 'sw-debug-error') { console.error('[SW DEBUG ERROR]', e.data.msg, e.data.stack, e.data.causeMsg); }
    if (type === 'sw-debug-pong') { console.log('[SW DEBUG PONG] tus version:', e.data.tusVersion); }
  });
  navigator.serviceWorker.ready.then(async () => {
    navigator.serviceWorker.controller?.postMessage({ type: 'sw-upload-status' });
      navigator.serviceWorker.controller?.postMessage({ type: 'sw-debug-ping' });
    // Auto-resume interrupted uploads from IndexedDB
    try {
      const pending = await idbGetAll();
      const now = Date.now();
      for (const rec of pending) {
        if (rec.status !== 'uploading') continue;
        if (now - rec.startedAt > 86400000) { idbDel(rec.uploadId).catch(()=>{}); continue; }
        // Only resume if file Blob is still alive
        if (!rec.file || !rec.file.size) { idbDel(rec.uploadId).catch(()=>{}); continue; }
        if (!state.uploads.find(u => u.id === rec.uploadId)) {
          state.uploads.push({ id: rec.uploadId, title: rec.title, status: 'uploading', progress: 0, timestamp: null });
        }
        navigator.serviceWorker.controller?.postMessage({ type: 'sw-upload-resume', uploadId: rec.uploadId });
        markUploadsDirty();   // resumed uploads tick too
        toast('Resuming upload: <b>' + esc(rec.title) + '</b>', 'info');
      }
      updateUploadBadge(); renderUploadCenter();
    } catch(err) { console.error('Resume check failed:', err); }
  });
  // Heartbeat: detect SW kill (no ack within 30s)
  let swAlive = Date.now();
  setInterval(() => {
    if (Date.now() - swAlive > 30000) {
      const stuck = state.uploads.filter(u => u.status === 'uploading');
      if (stuck.length) toast('Upload interrupted \u2014 will resume on next visit', 'error', 6000);
    }
    navigator.serviceWorker.controller?.postMessage({ type: 'sw-heartbeat' });
  }, 15000);
}

// ── LIVE UPDATES (SSE) — 18-09-26: auto-refresh grid saat server selesai proses video ──
// Server push event 'video' setiap status/has_storyboard/has_microclip berubah → load() tanpa refresh manual.
(function liveUpdates() {
  if (!window.EventSource) return;
  let es = null, retryMs = 3000, reconnectTimer = null, lastEvent = 0;
  let hadConnected = false, lastCatchup = 0;

  function connect() {
    try { es = new EventSource('/api/events'); } catch (e) { return scheduleRetry(); }
    es.onopen = () => {
      retryMs = 3000;
      // v2.3: SSE has no replay — every event fired while this page was disconnected
      // (tab hidden -> client closed ES; network blip; server restart) is gone.
      // Catch up with ONE load() on re-connect, throttled to 3s.
      if (hadConnected && Date.now() - lastCatchup > 3000) {
        lastCatchup = Date.now();
        load().catch(console.error);
      }
      hadConnected = true;
    };
    es.onmessage = ev => {
      lastEvent = Date.now();
      let d = null;
      try { d = JSON.parse(ev.data); } catch (e) { return; }
      if (!d) return;
      if (d.type === 'video' && d.id) {
        const v = state.videos.find(x => x.id === d.id);
        if (v) {
          const oldStatus = v.status; // vidme-rc5: simpan SEBELUM assign
          const changed = ['status','has_storyboard','has_microclip','duration','is_portrait','width','height'].some(k => String(v[k]) !== String(d[k]));
          Object.assign(v, d);
          // 19-09-26: patch the ONE card instead of re-rendering the whole grid —
          // a full render() destroys the hover-preview <video> mid-hover (RC4) and
          // is what made "storyboard attached" invisible without a manual refresh.
          if (changed) {
            window.stopPreview?.();              // never orphan a live preview <video> (IIFE-local, exposed on window)
            // vidme-rc5: transisi -> 'ready' butuh render() FULL karena section
            // Recent Uploads cuma dibangun saat render penuh (sort by created_at,
            // top 10). Patch in-place tidak pernah menambah kartu ke section itu.
            // vidme-paging: card di luar page aktif -> update state saja (render membuang posisi baca)
            if (d.status === 'ready' && oldStatus !== 'ready' && _onPageRenderable(d.id)) {
              render();
            } else {
              const els = document.querySelectorAll(`.video-card[data-id="${d.id}"]`);
              if (els.length) els.forEach(el => { el.outerHTML = card(v); });
              else if (_onPageRenderable(d.id)) render();
            }
            if (d.status === 'ready') { toast(`✓ <b>${esc(d.title||'video')}</b> ready`, 'success'); reconcileUploads(); } // vidme-bugfix-1021
          }
        } else if (d.status === 'ready') {
          // video baru muncul (upload dari device lain) — refresh penuh sekali
          load().catch(console.error);
        }
      }
    };
    es.onerror = () => { if (es) { es.close(); es = null; } scheduleRetry(); };
  }
  function scheduleRetry() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; retryMs = Math.min(retryMs * 2, 30000); connect(); }, retryMs);
  }
  // vidme-rc3: JANGAN tutup EventSource saat tab hidden. SSE tidak punya replay, jadi
  // setiap event yang terjadi selama tab hidden hilang permanen — persis itu sebabnya
  // storyboard hanya muncul setelah refresh manual (upload 7 menit, user pindah tab,
  // storyboard selesai di menit ke-10, event dibuang). Keepalive hanya komentar 25s;
  // penghematannya tidak sebanding dengan kehilangan event penyelesaian.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      // Tab kembali: selalu re-sync sekali (browser men-throttle timer di background),
      // lalu pastikan SSE hidup lagi.
      if (Date.now() - lastCatchup > 3000) { lastCatchup = Date.now(); load().catch(console.error); }
      if (!es) connect();
    }
  });
  connect();
  // vidme-rc5: polling safety net. SSE bisa mati diam-diam di mobile (SW lama yang
  // tidak punya listener ini sama sekali, battery optimization, koneksi drop tanpa
  // onerror). Tiap 30s kalau tab visible dan EventSource tidak dalam state OPEN,
  // resync sekali — pola yang sama dipakai FileBrowser/Seafile sebagai fallback.
  // load() = 2 fetch ringan; saat SSE sehat jalur ini tidak pernah jalan.
  setInterval(() => {
    if (document.hidden) return;
    const sseUp = es && es.readyState === 1; // 1 = OPEN
    if (!sseUp) load().catch(console.error);
  }, 30000);
})();
</script>
