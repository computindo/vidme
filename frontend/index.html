<!doctype html>
<html lang="en" class="bg-[#0b1326] text-slate-100">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VidMe</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/navidrome.svg">
  <link rel="preload" href="/material-symbols.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind.css">
  
  <style>
    @font-face{font-family:"Material Symbols Outlined";font-style:normal;font-weight:400;src:url(/material-symbols.woff2) format("woff2");font-display:block}.material-symbols-outlined{font-size:22px;line-height:1;font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
    .scrollbar::-webkit-scrollbar{width:5px}
    @media(min-width:1024px){aside.sidebar-scroll{display:flex!important;flex-direction:column;overflow:hidden}}.scrollbar::-webkit-scrollbar-thumb{background:#33405b;border-radius:9px}
    .video-card.select-mode .card-check { display:flex !important; }
    .video-card.selected { outline: 2px solid #6366f1; }
    /* Toast */
    #toastContainer { position:fixed; bottom:80px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; }
    .toast { display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:12px; font-size:13px; font-weight:500; opacity:0; transform:translateY(8px); transition:all .25s; pointer-events:auto; max-width:320px; }
    .toast.show { opacity:1; transform:translateY(0); }
    .toast.success { background:#1e3a2f; border:1px solid #22c55e44; color:#86efac; }
    .toast.error   { background:#3a1e1e; border:1px solid #ef444444; color:#fca5a5; }
    .toast.info    { background:#1e2a3a; border:1px solid #6366f144; color:#a5b4fc; }
    .toast-progress { height:3px; border-radius:4px; background:#6366f1; transition:width .2s; }
    /* Actions dropdown */
    #actionsMenu { min-width:160px; }
    /* Folder context menu */
    .ctx-menu { position:fixed; z-index:60; min-width:160px; }
    .ctx-item { width:100%; }
    /* Draggable modal */
    #uploadForm { cursor: default; }
    #modalHeader { cursor: grab; user-select: none; -webkit-user-select: none; }
    #modalHeader:active { cursor: grabbing; }
    /* Select toggle switch */
    #selectCheckbox {
      display: none;
    }
    .select-switch {
      position: relative;
      width: fit-content;
      padding: 8px 16px;
      background-color: #1a2236;
      border-radius: 0.5em;
      z-index: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: white;
      font-size: 0.85em;
      font-weight: 600;
      transition: all 0.3s;
      user-select: none;
    }
    .select-switch svg path {
      fill: white;
    }
    #selectCheckbox:checked + .select-switch {
      background-color: #7C70E6;
      box-shadow: 0px 0px 40px rgba(124, 112, 230, 0.438);
    }
    /* Upload button dark neumorphic */
    .upload-btn {
      position: relative;
      color: #fff;
      padding: 8px 16px;
      font-size: 0.85em;
      font-weight: 600;
      border-radius: 0.5em;
      background: #1a2236;
      border: 1px solid #1a2236;
      transition: all 0.3s;
      box-shadow: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .upload-btn:active {
      color: #aaa;
      box-shadow: none;
    }
    @media(min-width:1024px){#searchWrapper{display:block!important}#uploadOpen{display:flex!important}
      #sidebar{transition:margin-left 0.3s cubic-bezier(0.25,1,0.5,1)}
      .sidebar-collapsed #sidebar{margin-left:-280px}
      #main-content{transition:margin-left 0.3s cubic-bezier(0.25,1,0.5,1)}
      .sidebar-collapsed #main-content{margin-left:0!important}
      #main-content{margin-left:280px}
    }
    /* Upload reskin */
    .vidme-loader { display:block; width:20px; height:20px; position:relative; flex-shrink:0; }
    .vidme-loader:before, .vidme-loader:after { content:""; position:absolute; left:50%; bottom:0; width:12px; height:12px; border-radius:50%; background:#7dd3fc; transform:translate(-50%,0%) scale(1); animation:vidme_push 2s infinite linear; }
    .vidme-loader:after { animation-delay:1s; }
    @keyframes vidme_push { 0%,50%{ transform:translate(-50%,0%) scale(1); } 100%{ transform:translate(-50%,-100%) scale(0); } }
    .vidme-bar-bg { --h:8px; display:flex; align-items:center; box-sizing:border-box; padding:3px; width:100%; height:var(--h); background-color:#0f1a2a; box-shadow:#0c0c0c -2px 2px 4px 0px inset; border-radius:calc(var(--h)/2); overflow:hidden; }
    .vidme-bar { position:relative; display:flex; align-items:center; --h:6px; height:var(--h); width:0%; background:linear-gradient(0deg,rgba(14,165,233,1) 0%,rgba(125,211,252,1) 100%); border-radius:calc(var(--h)/2); transition:width 0.2s; overflow:hidden; }
    .vidme-bar-stripes { position:absolute; display:flex; align-items:center; gap:18px; }
    .vidme-bar-stripe { background:linear-gradient(-45deg,rgba(255,255,255,1) 0%,rgba(255,255,255,0) 70%); width:10px; height:45px; opacity:0.3; rotate:45deg; }
    /* vidme-v27: pagination css baru (pengganti pg lama) */
    .pagination-wrapper { display:flex; justify-content:center; padding:20px 0 8px; }
    .j-pagination { display:inline-flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; }
    .j-pagination .pagination__item { min-width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; padding:0 8px; border-radius:8px; color:#94a3b8; font-size:14px; cursor:pointer; text-decoration:none; transition:all .15s; }
    .j-pagination a.pagination__item:hover { background:#1e293b; color:#e2e8f0; }
    .j-pagination .pagination-active { background:rgba(99,102,241,.15); border:1px solid #6366f1; color:#a5b4fc; font-weight:700; }
    .j-pagination .pagination-disabled { opacity:.35; cursor:not-allowed; }
    /* vidme-v27: Suggested 15 desktop / 12 mobile */
    .sugg-grid > *:nth-child(n+13) { display:none; }
    @media (min-width: 1024px) { .sugg-grid > *:nth-child(n+13) { display:revert; } }
    /* vidme-v27: explore v2 css — From Uiverse.io by vinodjangid07, hijau diganti biru langit (catatan user 25-09-26) */
    .button {
      width: 110px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      background-color: rgb(56, 189, 248);
      border-radius: 30px;
      color: rgb(19, 19, 19);
      font-weight: 600;
      border: none;
      position: relative;
      cursor: pointer;
      box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.116);
      padding-left: 8px;
      transition-duration: .5s;
    }

    .svgIcon {
      height: 25px;
      transition-duration: 1.5s;
    }

    .button:hover {
      background-color: rgb(125, 211, 252);
      transition-duration: .5s;
    }

    .button:active {
      transform: scale(0.97);
      transition-duration: .2s;
    }

    .button:hover .svgIcon {
      transform: rotate(250deg);
      transition-duration: 1.5s;
    }
    /* vidme-recent-hero v2.5: one large card per slide, scoped to Recent Uploads */
    .recent-slider { position:relative; width:min(100%,960px); margin:0 auto; overflow:hidden; border-radius:16px; background:#0b1326; box-shadow:0 12px 32px rgba(0,0,0,.28); }
    .recent-slides { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .recent-slides::-webkit-scrollbar { display:none; }
    .recent-slides .video-card { position:relative; flex:0 0 100%; width:100%; min-width:100%; margin:0; padding:0 !important; overflow:hidden; border-radius:16px; scroll-snap-align:start; scroll-snap-stop:always; background:#111827; }
    .recent-slides .video-card:hover { transform:none; background:#111827; }
    .recent-slides .video-card > .relative { aspect-ratio:16 / 9; border-radius:0; background:#050507; }
    .recent-slides .video-card > .relative::after { content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.08) 58%,rgba(0,0,0,.1)); }
    .recent-slides .video-card > p.mt-3 { position:absolute; z-index:2; left:28px; right:28px; bottom:40px; margin:0; color:#fff; font-size:clamp(1.1rem,2.2vw,1.8rem); line-height:1.2; text-shadow:0 2px 8px rgba(0,0,0,.7); }
    .recent-slides .video-card > p.text-xs { position:absolute; z-index:2; left:28px; bottom:18px; margin:0; color:rgba(226,232,240,.78); }
    .recent-slides .video-card .absolute { z-index:3; }
    .recent-nav { position:absolute; z-index:5; top:50%; width:52px; height:52px; padding:0; border:1px solid rgba(255,255,255,.65); border-radius:50%; line-height:1; text-align:center; cursor:pointer; transform:translateY(-50%); background:rgba(255,255,255,.84); color:#1e293b; box-shadow:0 3px 12px rgba(0,0,0,.28); user-select:none; -webkit-user-select:none; transition:all .2s ease; }
    .recent-nav:hover { background:#fff; color:#0f172a; transform:translateY(-50%) scale(1.08); }
    #recent-prev { left:18px; }
    #recent-next { right:18px; }
    .recent-counter { position:absolute; z-index:5; top:16px; right:20px; padding:5px 10px; border-radius:999px; background:rgba(0,0,0,.48); color:#fff; font-size:12px; font-weight:700; letter-spacing:.04em; }
    .recent-dots { position:absolute; z-index:5; left:50%; bottom:16px; display:flex; align-items:center; gap:8px; transform:translateX(-50%); }
    .recent-dot { width:9px; height:9px; padding:0; border:0; border-radius:5px; cursor:pointer; background:rgba(255,255,255,.52); transition:all .3s cubic-bezier(.77,0,.175,1); }
    .recent-dot:hover { background:rgba(255,255,255,.82); }
    .recent-dot.active { width:24px; background:#fff; box-shadow:0 1px 5px rgba(0,0,0,.35); }
    @media (max-width:640px) {
      .recent-slider { border-radius:12px; }
      .recent-slides .video-card { border-radius:12px; }
      .recent-slides .video-card > p.mt-3 { left:18px; right:18px; bottom:34px; }
      .recent-slides .video-card > p.text-xs { left:18px; bottom:14px; }
      .recent-nav { width:42px; height:42px; }
      #recent-prev { left:10px; }
      #recent-next { right:10px; }
      .recent-counter { top:10px; right:12px; }
      .recent-dots { bottom:10px; }
    }

    /* ── vidme-cardsize v2.2 (22-09-26): grid ala Vcs (minmax), SEMUA frame 9:16, landscape letterbox (user opsi A) ── */
    #videos .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
    @media (min-width: 760px) { #videos .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); } }
    @media (min-width: 1100px) { #videos .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); } }
    #videos .grid .video-card { width: auto; min-width: 0; }
    #videos .grid .video-card .aspect-video { aspect-ratio: 200.833 / 414.097; background: #050507; }
    #videos .grid .video-card .aspect-video img { object-fit: contain; } /* letterbox: landscape utuh, bar atas-bawah */
    /* ── Player view CSS (from player.html, deduped) ── */
    @font-face{font-family:"Material Symbols Outlined";font-style:normal;font-weight:400;src:url(/material-symbols.woff2) format("woff2");font-display:block}.material-symbols-outlined{font-size:22px;line-height:1;font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
    /* Skip flash */
    .skip-flash {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,0.55); border-radius: 9999px;
      padding: 10px 18px; font-size: 14px; font-weight: 600;
      opacity: 0; transition: opacity 0.15s;
      color: #fff; white-space: nowrap;
      pointer-events: none;
      user-select: none;
      z-index: 25;
    }
    .skip-flash.show { opacity: 1; }
    /* Tap zones + center tap: no text selection, no tap highlight */
    #tap-left, #tap-right, #center-tap {
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    /* Play icon fade (opacity only, never visibility:hidden) */
    #play-icon {
      transition: opacity 0.2s;
    }
    /* Controls overlay */
    #controls-overlay {
      transition: opacity 0.25s;
      pointer-events: none;
    }
    #controls-overlay.hidden-ctrl {
      opacity: 0;
    }
    #controls-overlay input,
    #controls-overlay button {
      pointer-events: auto;
    }
    /* Fullscreen: center + fill */
    #player-wrap:-webkit-full-screen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
    #player-wrap:fullscreen { width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
    #player-wrap:-webkit-full-screen video { width:100%; height:100%; object-fit:contain; }
    #player-wrap:fullscreen video { width:100%; height:100%; object-fit:contain; }
  /* Buffering spinner */
  .vid-spinner svg { transform-origin:center; animation:rotate4 2s linear infinite; }
  .vid-spinner circle { fill:none; stroke:hsl(214,97%,59%); stroke-width:2; stroke-dasharray:1,200; stroke-dashoffset:0; stroke-linecap:round; animation:dash4 1.5s ease-in-out infinite; }
  @keyframes rotate4 { 100%{ transform:rotate(360deg); } }
  @keyframes dash4 { 0%{stroke-dasharray:1,200;stroke-dashoffset:0} 50%{stroke-dasharray:90,200;stroke-dashoffset:-35px} 100%{stroke-dashoffset:-125px} }

    /* Upload UI (mirrored from index.html) */

    /* ── SPA player view: sidebar collapse (Ticket 05) ── */
    body.pv-mode #sidebar { transform: translateX(-100%); transition: transform .3s cubic-bezier(0.25,1,0.5,1); }
    body.pv-mode #sidebar.pv-sidebar-open { transform: translateX(0); }
    #pvSidebarLogo { display: none; }
    body.pv-mode #pvSidebarLogo { display: flex; align-items: center; }
    @media(min-width:1024px){ body.pv-mode #pvSidebarLogo { display: flex; } }
    /* ── SPA player view: bottom nav clearance (Bug fix) ── */
    body.pv-mode #view-player { padding-bottom: 72px; }
    @media(min-width:1024px){ body.pv-mode #view-player { padding-bottom: 0; } }
  </style>
</head>

<body class="min-h-screen bg-[#0b1326] font-body">

  <!-- Toast container -->
  <div id="toastContainer"></div>

  <!-- SPA view: browse -->
  <div id="view-browse">

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 hidden w-[280px] border-r border-slate-800 bg-[#10182b] p-6 lg:block sidebar-scroll">
    <div class="mb-10 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 text-2xl font-bold font-heading">
        <span class="material-symbols-outlined text-indigo-400">play_circle</span>VidMe
      </a>
      <button id="sidebarToggleBtn" onclick="toggleSidebar()" title="Collapse sidebar" style="display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;background:transparent;border:none;cursor:pointer;color:#475569;flex-shrink:0"><span class="material-symbols-outlined">left_panel_close</span></button>
    </div>
    <div class="mb-4 flex items-center justify-between">
      <h2 class="text-xs font-semibold uppercase tracking-widest text-slate-500">Folders</h2>
      <button id="newFolder" class="rounded p-1 text-slate-400 hover:bg-slate-700" title="New folder">
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>
    <nav id="folders" class="scrollbar space-y-1 overflow-y-auto" style="flex:1;min-height:0"></nav>
  </aside>

  <!-- Main -->
  <main id="main-content" class="pb-24 lg:pb-8">
    <header class="sticky top-0 z-30 flex items-center gap-3 border-b border-slate-800 bg-[#0b1326]/90 px-4 py-4 backdrop-blur md:px-8">
      <button id="sidebarRevealBtn" onclick="toggleSidebar()" title="Open sidebar" style="display:none;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 10px;border-radius:8px;background:#10182b;border:1px solid #1e293b;cursor:pointer;color:#94a3b8;font-size:13px;white-space:nowrap;flex-shrink:0"><span class="material-symbols-outlined" style="font-size:20px">left_panel_open</span></button>
      <h1 class="font-heading text-xl font-semibold lg:hidden">VidMe</h1>
      <div id="searchWrapper" class="relative ml-auto w-full max-w-md" style="display:none">
        <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-500">search</span>
        <input id="search" class="w-full rounded-xl border border-slate-700 bg-[#171f33] py-2.5 pl-10 pr-10 outline-none focus:border-indigo-400" placeholder="Search videos">
        <button type="button" class="search-clear" id="searchClearDesktop" style="display:none;position:absolute;right:8px;top:9px;z-index:10;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:transparent;color:#94a3b8;cursor:pointer" onclick="clearSearch()" aria-label="Clear search"><span class="material-symbols-outlined" style="font-size:18px">close</span></button>
      </div>
      <input type="checkbox" id="selectCheckbox" />
      <label for="selectCheckbox" class="select-switch" id="selectToggle" style="margin-left:auto">
        <span class="material-symbols-outlined" style="font-size:18px">checklist</span>
        <span class="hidden sm:inline">Select</span>
      </label>
      <button id="uploadOpen" onclick="toggleUploadCenter()" class="upload-btn" style="display:none">
        <span class="material-symbols-outlined" style="font-size:18px">upload</span>
        <span class="hidden sm:inline">Upload</span>
        <span id="uploadBadgeDesktop" class="hidden absolute -top-1 -right-1 min-w-[18px] h-[18px] text-white text-[10px] font-bold flex items-center justify-center px-1" style="background:#7C70E6;box-shadow:0 0 8px rgba(124,112,230,0.6)">0</span>
      </button>
    </header>

    <section class="px-4 py-8 md:px-8">
      <div id="mobileSearchOverlay" style="display:none;margin-bottom:16px"><div style="position:relative"><span class="material-symbols-outlined" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748b;pointer-events:none">search</span><input id="mobileSearchInput" placeholder="Search videos..." style="width:100%;background:#171f33;border:1px solid #334155;border-radius:12px;padding:10px 40px 10px 40px;color:#f1f5f9;outline:none;font-size:15px" oninput="document.getElementById('search').value=this.value;render()" onkeydown="if(event.key==='Enter'){this.blur()}"><button type="button" class="search-clear" id="searchClearMobile" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);z-index:10;align-items:center;justify-content:center;width:28px;height:28px;border:none;background:transparent;color:#94a3b8;cursor:pointer" onclick="clearSearch('mobile')" aria-label="Clear search"><span class="material-symbols-outlined" style="font-size:18px">close</span></button></div></div><div class="mb-6 flex items-end justify-between">
        <div>
          <p class="text-sm text-indigo-300">Your collection</p>
          <h2 id="heading" class="font-heading text-3xl font-bold">All videos</h2>
        </div>
        <span id="count" class="text-sm text-slate-500"></span>
      </div>
      <div id="videos" class="space-y-10"></div>
      <p id="empty" class="hidden py-20 text-center text-slate-500">No videos found.</p>
    </section>
  </main>

  </div><!-- /view-browse -->

  <!-- SPA view: player (hidden by default; populated by SPA migration) -->
  <div id="view-player" style="display:none">
<header class="flex items-center gap-3 border-b border-slate-800 px-4 py-3">
      <button id="pvSidebarLogo" title="Open sidebar" style="align-items:center;gap:8px;padding:6px 12px;border-radius:10px;background:transparent;border:none;cursor:pointer;color:#a5b4fc;font-weight:700;font-size:15px"><span class="material-symbols-outlined" style="color:#818cf8">play_circle</span>VidMe</button>
      <a href="/" id="btn-goback" class="ml-auto flex items-center gap-2 rounded-lg px-3 py-2 text-sm text-slate-300 hover:bg-slate-800">
        <span class="material-symbols-outlined">arrow_back</span>Back
      </a>
    </header>
<main class="mx-auto max-w-6xl px-4 py-6 md:px-8" style="padding-top:24px">
    <!-- Video container: shrink-wrap -->
    <div class="relative overflow-hidden rounded-2xl bg-black" id="player-wrap" style="width:100%;height:80vh;border:none;outline:none;visibility:hidden;background:#000">
      <!-- Double-tap zones (mobile skip) — left/right 1/3 -->
      <div id="tap-left"  class="absolute top-0 left-0 z-10" style="height:100%;width:calc(33.333% + 1px)"></div>
      <div id="tap-right" class="absolute top-0 right-0 z-10" style="height:100%;width:calc(33.333% + 1px)"></div>
      <!-- Center tap: play/pause — covers middle 1/3, always in DOM -->
      <button id="center-tap" class="absolute top-0 left-1/3 z-20 w-1/3 border-0 p-0 bg-transparent" style="height:100%">
        <div id="play-icon" class="flex items-center justify-center w-full h-full">
          <div class="rounded-full bg-black/60 p-4 pointer-events-none">
            <span id="play-icon-symbol" class="material-symbols-outlined text-white" style="font-size:48px">play_arrow</span>
          </div>
        </div>
      </button>
      <!-- Skip flash indicators -->
      <div id="flash-left"  class="skip-flash" style="left:10%">-5s</div>
      <div id="flash-right" class="skip-flash" style="right:10%">+5s</div>
      <!-- Video -->
      <video id="video" preload="metadata" playsinline muted style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;background:#000"></video>
      <div id="vid-loader" style="display:none;position:absolute;inset:0;z-index:25;pointer-events:none;display:flex;align-items:center;justify-content:center;background:transparent">
        <div style="border-radius:9999px;background:rgba(0,0,0,0.6);padding:16px;display:flex;align-items:center;justify-content:center">
          <div class="vid-spinner">
            <svg viewBox="25 25 50 50" style="width:48px;height:48px">
              <circle r="20" cy="50" cx="50"></circle>
            </svg>
          </div>
        </div>
      </div>
      <!-- Controls overlay -->
      <div id="controls-overlay" class="absolute inset-x-0 bottom-0 z-30 bg-gradient-to-t from-black/90 to-transparent p-4 pt-16">
        <input id="seek" type="range" min="0" value="0" class="mb-3 h-1 w-full cursor-pointer accent-indigo-400">
        <div class="flex items-center gap-3">
          <button id="btn-play" aria-label="Play/Pause">
            <span class="material-symbols-outlined">play_arrow</span>
          </button>
          <button id="btn-back" aria-label="Back 5s" title="Back 5s">
            <span class="material-symbols-outlined">replay_5</span>
          </button>
          <button id="btn-fwd" aria-label="Forward 5s" title="Forward 5s">
            <span class="material-symbols-outlined">forward_5</span>
          </button>
          <span id="time" class="text-xs">0:00 / 0:00</span>
          <input id="volume" class="ml-auto w-20 accent-indigo-400" type="range" min="0" max="1" step=".05" value="1" aria-label="Volume">
          <button id="btn-full" aria-label="Fullscreen">
            <span class="material-symbols-outlined">fullscreen</span>
          </button>
        </div>
      </div>
    </div>
    <!-- Info section -->
    <section class="py-6">
      <div class="flex items-center gap-2 group/title">
        <h1 id="title" class="font-heading text-2xl font-bold" style="word-break: break-word; overflow-wrap: anywhere;">Loading…</h1>
        <button id="btn-edit-title" class="rounded p-1 text-slate-500 hover:text-indigo-300 opacity-0 group-hover/title:opacity-100 transition" title="Edit title">
          <span class="material-symbols-outlined" style="font-size:18px">edit</span>
        </button>
      </div>
      <input id="videoTitleInput" class="hidden w-full rounded-lg border border-indigo-400 bg-[#171f33] px-3 py-2 font-heading text-2xl font-bold outline-none mt-1" type="text">
      <p id="date" class="mt-2 text-sm text-slate-500"></p>
      <div class="mt-5 flex flex-wrap items-center gap-3">
        <button id="btn-loop" class="pill rounded-full border border-slate-700 px-4 py-2 text-sm">
          <span class="material-symbols-outlined align-middle">repeat</span> Loop
        </button>
        <button id="btn-pin" class="pill rounded-full border border-slate-700 px-4 py-2 text-sm">
          <span class="material-symbols-outlined align-middle">push_pin</span> Pin
        </button>
        <a id="btn-download" class="pill rounded-full border border-slate-700 px-4 py-2 text-sm" download>
          <span class="material-symbols-outlined align-middle">download</span> Download
        </a>
        <select id="resolution" class="rounded-full border border-slate-700 bg-[#171f33] px-4 py-2 text-sm outline-none"></select>
      </div>
    </section>
</main>
</div>

  <!-- Bottom nav mobile -->
  <nav id="bottomNav" class="fixed inset-x-0 bottom-0 z-40 flex justify-around border-t border-slate-800 bg-[#10182b] p-3 lg:hidden">
    <a href="/" class="flex flex-col items-center gap-1 text-xs text-indigo-300"><span class="material-symbols-outlined">home</span>Home</a>
    <button onclick="var o=document.getElementById('mobileSearchOverlay');var show=o.style.display==='none';o.style.display=show?'block':'none';if(show){document.getElementById('mobileSearchInput').focus()}else{document.getElementById('mobileSearchInput').value='';document.getElementById('search').value='';render()}" class="flex flex-col items-center gap-1 text-xs text-slate-400"><span class="material-symbols-outlined">search</span>Search</button>
    <button onclick="toggleUploadCenter()" class="relative flex flex-col items-center gap-1 text-xs text-slate-400"><span class="material-symbols-outlined">upload</span>Upload<span id="uploadBadge" class="hidden absolute -top-1 right-1 min-w-[18px] h-[18px] rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center px-1">0</span></button>
    <button onclick="toggleLibraryPanel()" class="flex flex-col items-center gap-1 text-xs text-slate-400"><span class="material-symbols-outlined">video_library</span>Library</button>
  </nav>

  <!-- Multi-select action bar -->
  <div id="selectBar" class="hidden fixed inset-x-0 bottom-0 z-30 items-center gap-2 border-t border-slate-700 bg-[#171f33] px-3 py-2 lg:pl-[296px]">
    <span id="selCount" class="text-xs text-slate-300 shrink-0">0 selected</span>
    <button id="selAll"  class="shrink-0 rounded-lg border border-slate-600 px-2 py-1 text-xs hover:bg-slate-700">All</button>
    <button id="selNone" class="shrink-0 rounded-lg border border-slate-600 px-2 py-1 text-xs hover:bg-slate-700">None</button>
    <!-- Actions dropdown -->
    <div class="relative ml-auto">
      <button id="selActionsBtn" class="shrink-0 flex items-center gap-1 rounded-lg bg-indigo-600 px-3 py-1.5 text-xs font-semibold hover:bg-indigo-500 disabled:opacity-40" disabled>
        <span class="material-symbols-outlined" style="font-size:16px">tune</span>
        <span id="selActionsLabel">Actions</span>
        <span class="material-symbols-outlined" style="font-size:14px">expand_less</span>
      </button>
      <div id="actionsMenu" class="absolute bottom-full right-0 mb-2 hidden rounded-xl border border-slate-700 bg-[#10182b] py-1 shadow-xl">
        <button id="actCopy"   class="flex w-full items-center gap-3 px-4 py-2.5 text-sm hover:bg-slate-800"><span class="material-symbols-outlined" style="font-size:18px">file_copy</span>Copy to folder</button>
        <button id="actMove"   class="flex w-full items-center gap-3 px-4 py-2.5 text-sm hover:bg-slate-800"><span class="material-symbols-outlined" style="font-size:18px">drive_file_move</span>Move to folder</button>
        <button id="actPin"    class="flex w-full items-center gap-3 px-4 py-2.5 text-sm hover:bg-slate-800"><span class="material-symbols-outlined" style="font-size:18px">push_pin</span>Pin selected</button>
        <button id="actUnpin"  class="flex w-full items-center gap-3 px-4 py-2.5 text-sm hover:bg-slate-800"><span class="material-symbols-outlined" style="font-size:18px">cancel</span>Unpin selected</button>
        <button id="actDownload" class="flex w-full items-center gap-3 px-4 py-2.5 text-sm hover:bg-slate-800"><span class="material-symbols-outlined" style="font-size:18px">download</span>Download as ZIP</button>
        <div class="my-1 border-t border-slate-700"></div>
        <button id="actDelete" class="flex w-full items-center gap-3 px-4 py-2.5 text-sm text-red-400 hover:bg-slate-800"><span class="material-symbols-outlined" style="font-size:18px">delete</span>Delete selected</button>
      </div>
    </div>
    <button id="selCancel" class="shrink-0 rounded-lg border border-slate-600 px-2 py-1 text-xs hover:bg-slate-700">Cancel</button>
  </div>

  <!-- Upload Modal -->
  <div id="modal" class="fixed inset-0 z-40 hidden bg-black/60 backdrop-blur-sm" style="display:none">
    <form id="uploadForm" class="fixed z-50 w-full max-w-lg rounded-2xl border border-slate-700 bg-[#171f33] p-6 shadow-2xl" style="top:50%;left:50%;transform:translate(-50%,-50%)">
      <div id="modalHeader" class="mb-5 flex justify-between">
        <h2 class="font-heading text-xl font-semibold">Upload video</h2>
        <button type="button" onclick="closeModal()" class="text-slate-400"><span class="material-symbols-outlined">close</span></button>
      </div>
      <label id="drop" class="block cursor-pointer rounded-xl border-2 border-dashed border-slate-600 p-10 text-center hover:border-indigo-400">
        <input id="file" name="video" type="file" class="hidden" multiple> <!-- vidme-mupload: multi-file -->
        <span class="material-symbols-outlined mb-2 text-4xl text-indigo-400">cloud_upload</span>
        <p id="fileName">Drop a video here or click to browse</p>
      </label>
      <div class="mt-4 space-y-3">
        <input name="title" id="titleInput" class="w-full rounded-lg border border-slate-700 bg-[#0b1326] p-3 outline-none" placeholder="Title (optional)">
        <select name="folder_id" id="folderSelect" class="w-full rounded-lg border border-slate-700 bg-[#0b1326] p-3 outline-none">
          <option value="">No folder</option>
        </select>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button type="button" onclick="closeModal()" class="rounded-xl px-4 py-2 text-slate-300 hover:bg-slate-700">Cancel</button>
        <button id="startUploadBtn" class="rounded-xl bg-indigo-500 px-5 py-2 font-semibold hover:bg-indigo-400">Start Upload</button>
      </div>
    </form>
  </div>

  <!-- Folder picker modal (copy/move) -->
  <div id="folderPickerModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
    <div class="w-full max-w-sm rounded-2xl border border-slate-700 bg-[#171f33] p-6 shadow-2xl">
      <h2 id="folderPickerTitle" class="font-heading text-lg font-semibold mb-4">Pick folder</h2>
      <div id="folderPickerList" class="space-y-2 max-h-60 overflow-y-auto mb-4"></div>
      <div class="flex justify-end">
        <button id="folderPickerCancel" class="rounded-xl px-4 py-2 text-slate-300 hover:bg-slate-700">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Custom prompt modal -->
  <div id="promptModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
    <div class="w-full max-w-sm rounded-2xl border border-slate-700 bg-[#171f33] p-6 shadow-2xl">
      <h2 id="promptTitle" class="font-heading text-lg font-semibold mb-4">Enter value</h2>
      <input id="promptInput" class="w-full rounded-lg border border-slate-700 bg-[#0b1326] p-3 outline-none focus:border-indigo-400 mb-4" type="text" placeholder="">
      <div class="flex justify-end gap-3">
        <button id="promptCancel" class="rounded-xl px-4 py-2 text-slate-300 hover:bg-slate-700">Cancel</button>
        <button id="promptOk" class="rounded-xl bg-indigo-500 px-5 py-2 font-semibold hover:bg-indigo-400">OK</button>
      </div>
    </div>
  </div>

  <!-- Custom confirm modal -->
  <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
    <div class="w-full max-w-sm rounded-2xl border border-slate-700 bg-[#171f33] p-6 shadow-2xl">
      <h2 id="confirmTitle" class="font-heading text-lg font-semibold mb-2">Confirm</h2>
      <p id="confirmMsg" class="text-slate-300 text-sm mb-6"></p>
      <div class="flex justify-end gap-3">
        <button id="confirmCancel" class="rounded-xl px-4 py-2 text-slate-300 hover:bg-slate-700">Cancel</button>
        <button id="confirmOk" class="rounded-xl bg-red-600 px-5 py-2 font-semibold hover:bg-red-500">Delete</button>
      </div>
    </div>
  </div>

<!-- Mobile Library Panel (GDrive style) -->
<div id="libraryPanel" class="fixed inset-0 z-40 hidden flex-col bg-[#0b1326] lg:hidden translate-y-full transition-transform duration-300 ease-out">
  <div class="flex items-center justify-between border-b border-slate-800 px-4 py-4">
    <h2 class="font-heading text-xl font-bold">Library</h2>
    <div class="flex items-center gap-2">
      <button onclick="createNewFolder()" class="rounded p-1 text-slate-400 hover:text-indigo-300" title="New folder"><span class="material-symbols-outlined">create_new_folder</span></button>
      <button onclick="toggleLibraryPanel()" class="rounded p-1 text-slate-400 hover:text-indigo-300"><span class="material-symbols-outlined">close</span></button>
    </div>
  </div>
  <div id="libraryList" class="scrollbar flex-1 overflow-y-auto"></div>
</div>



<div id="ctxMenu" class="hidden fixed z-50 min-w-[160px] rounded-xl border border-slate-700 bg-[#1a2236] py-1 shadow-xl text-sm text-slate-200"></div>
<!-- Upload Center drawer (mobile + desktop) -->
<div id="uploadCenter" class="fixed inset-x-0 bottom-0 z-40 hidden flex-col rounded-t-2xl border border-slate-700 bg-[#10182b] shadow-2xl lg:left-auto lg:right-4 lg:bottom-4 lg:w-[380px] lg:rounded-2xl" style="max-height:70vh;transform:translateY(100%);transition:transform .3s ease-out">
  <div class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
    <div class="flex items-center gap-2">
      <h2 class="font-heading text-lg font-bold">Upload Center</h2>
      <span id="ucActiveBadge" class="rounded-full bg-indigo-500 px-2 py-0.5 text-xs font-semibold text-white">0</span>
    </div>
    <button onclick="toggleUploadCenter()" class="text-slate-400"><span class="material-symbols-outlined">close</span></button>
  </div>
  <div id="uploadCenterBody" class="scrollbar flex-1 overflow-y-auto px-4 py-3"></div>
  <div class="border-t border-slate-800 p-4">
    <button onclick="toggleUploadCenter();setTimeout(openModal,350)" class="flex w-full items-center justify-center gap-2 rounded-xl bg-indigo-500 py-3 font-semibold hover:bg-indigo-400"><span class="material-symbols-outlined">add</span>New Upload</button>
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
