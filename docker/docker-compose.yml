services:
  vidme:
    image: vidme:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vidme
    environment:
      TZ: Asia/Jakarta
      STORAGE_PATH: /storage
      PORT: 4100
      NODE_ENV: production
      WEBDAV_USER: vidme
      WEBDAV_PASS: vidme123
    ports:
      - 4100:4100
    volumes:
      - /mnt/Storage1/Docker/vidme:/storage
      - /mnt/Storage1/Docker/nextcloud-data/userdata/naufalzimt/files/sementara:/import/sementara:ro
      - ../backend/server.js:/app/backend/server.js:ro
      - ../backend/logger.js:/app/backend/logger.js:ro
      - ../frontend:/app/frontend:ro
      - ../backend/db:/app/backend/db:ro
      - /etc/localtime:/etc/localtime:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    restart: unless-stopped
networks: {}
